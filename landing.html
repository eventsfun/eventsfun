<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"DM Sans",sans-serif;background:#f4f3f0;color:#1a1a1a;min-height:100vh;padding:32px 16px 80px}
.wrap{max-width:520px;margin:0 auto}
.card{background:#fff;border-radius:16px;padding:28px 24px;margin-bottom:16px;box-shadow:0 2px 16px rgba(0,0,0,.06)}
.ev-date{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#7a7a7a;margin-bottom:10px}
.ev-title{font-family:"Syne",sans-serif;font-size:clamp(18px,5vw,26px);font-weight:800;letter-spacing:-.5px;margin-bottom:8px;word-break:break-word;overflow-wrap:break-word;hyphens:auto}

.lp-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.lp-lbl{display:block;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#707070;margin-bottom:6px}
.lp-inp{width:100%;padding:11px 14px;border:1.5px solid #e0ddd8;border-radius:9px;font-size:13px;color:#1a1a1a;background:#fafaf8;outline:none;font-family:inherit;transition:border-color .2s}

.lp-cnt{display:flex;align-items:center;gap:12px;margin-top:4px}

.lp-nl{display:flex;align-items:center;gap:10px;font-size:13px;color:#6a6a6a;cursor:pointer;margin-top:8px}

<script>
/* ============================================================
   SUPABASE CONFIG
   ============================================================ */
var SB_URL = 'https://vousendridklswygvqpl.supabase.co';
var SB_KEY = 'sb_publishable_E1TzusZXAVuEY5aFqqsv6g_ilytdBP1';

function sbH() { return { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' }; }
async function sbGet(table, filters, sel) {
  var url = SB_URL + '/rest/v1/' + table + '?';
  if (sel) url += 'select=' + sel + '&';
  Object.entries(filters || {}).forEach(function(e) { url += e[0] + '=eq.' + encodeURIComponent(e[1]) + '&'; });
  var r = await fetch(url, { headers: sbH() });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
async function sbPost(table, data) {
  var r = await fetch(SB_URL + '/rest/v1/' + table, {
    method: 'POST', headers: Object.assign({}, sbH(), { 'Prefer': 'return=representation' }), body: JSON.stringify(data)
  });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
/* Inserimento senza rilettura: usa return=minimal, cosi' non serve poter leggere la riga appena creata */
async function sbInsert(table, data) {
  var r = await fetch(SB_URL + '/rest/v1/' + table, {
    method: 'POST', headers: Object.assign({}, sbH(), { 'Prefer': 'return=minimal' }), body: JSON.stringify(data)
  });
  if (!r.ok) throw new Error(await r.text());
  return true;
}
/* Chiamata a funzione DB (canale limitato lato server) */
async function sbRpc(fn, args) {
  var r = await fetch(SB_URL + '/rest/v1/rpc/' + fn, {
    method: 'POST', headers: sbH(), body: JSON.stringify(args || {})
  });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
/* Conteggio posti dal canale pubblico: SOLO numeri, nessun dato personale */
async function fetchCapacity(eventId) {
  var rows = await sbRpc('ef_event_capacity', { p_event_id: eventId });
  var c = (Array.isArray(rows) ? rows[0] : rows) || {};
  return {
    occupati: c.occupati || 0,
    capienza: (c.capienza === undefined || c.capienza === null) ? null : c.capienza,
    opt_capienza: !!c.opt_capienza,
    piena: !!c.piena
  };
}
/* Genera un identificativo univoco lato client (uuid v4) */
function genId() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
    var r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
    return v.toString(16);
  });
}

/* ============================================================
   STATE
   ============================================================ */
var ev = null;
var cap = { occupati: 0, capienza: null, opt_capienza: false, piena: false };
var adultiCount = 1;
var bambiniCount = 0;

/* ============================================================

   ============================================================ */
var TXT_INFO = {
  titoloPagina: 'Informazioni evento - EventsFun',
  tabInfo: 'Informazioni',
  titoloInfo: 'Richiedi informazioni',
  titoloEntrambe: 'Hai domande? Lasciaci i tuoi dati',

  chTelefono: 'Telefono',

  chEmail: 'Email',

  consensoPre: 'Ho letto e accetto l\'',
  consensoLink: 'informativa sul trattamento dei dati personali',
  btnInvia: 'Invia richiesta',
  invio: 'Invio in corso...',
  chiuso: 'Le richieste di informazioni per questo evento sono chiuse',
  richiamoIscr: 'Vuoi partecipare all\'evento?',
  vuoiAnche: 'Vuoi anche {azione}?',
  rivedi: 'Rivedi le informazioni',
  errNome: 'Inserisci il tuo nome.',
  errTel: 'Inserisci il numero di telefono: serve per ricontattarti con una telefonata o su WhatsApp.',
  errTelVal: 'Inserisci un numero di telefono valido.',
  errEmail: 'Inserisci la tua email.',
  errEmailVal: 'Inserisci un indirizzo email valido.',
  errConsenso: 'Devi accettare il trattamento dei dati per procedere.',
  errInvio: 'Si è verificato un errore. Riprova tra qualche secondo.',
  okTitolo: 'Grazie, {nome}!',
  okTesto: 'La tua richiesta per <strong>{evento}</strong> è arrivata all\'organizzatore.<br>Ti ricontatteremo al più presto {canale}.',
  okCanale: { telefono: 'con una telefonata', whatsapp: 'su WhatsApp', email: 'via email' },
  footerInfo: 'I dati di questa richiesta sono raccolti e gestiti esclusivamente dall\'organizzatore dell\'evento. Nessun marketplace, nessun uso da parte di terzi.',
  footerEntrambe: 'I dati che invii sono raccolti e gestiti esclusivamente dall\'organizzatore dell\'evento. Nessun marketplace, nessun uso da parte di terzi.'
};

/* Modalita' dell'evento: iscrizioni (come sempre) / info / entrambe */
function modalitaEvento() {
  var m = ev && ev.modalita;
  return (m === 'info' || m === 'entrambe') ? m : 'iscrizioni';
}

/* Scheda che si apre per prima: il link ?vista= vince sulla scelta dell'organizzatore */
function schedaIniziale() {
  var v = new URLSearchParams(window.location.search).get('vista');
  if (v === 'info' || v === 'iscrizione') return v;
  return (ev && ev.landing_scheda_iniziale === 'iscrizione') ? 'iscrizione' : 'info';
}

/* Mette in sicurezza un testo prima di inserirlo nella pagina */
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

/* Testo in sicurezza + indirizzi http/https resi cliccabili (nuova scheda) */
function autoLink(testo) {
  var s = String(testo == null ? '' : testo);
  var re = /https?:\/\/[^\s<>"']+/g;
  var out = '', last = 0, m;
  while ((m = re.exec(s)) !== null) {
    var url = m[0], coda = '';
    var mm = url.match(/[.,;:!?)\]]+$/);
    if (mm) { coda = mm[0]; url = url.slice(0, url.length - coda.length); }
    out += esc(s.slice(last, m.index));
    if (url.length > 10) {
      out += '<a href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' + esc(url) + '</a>';
    } else {
      out += esc(url);
    }
    out += esc(coda);
    last = m.index + m[0].length;
  }
  return out + esc(s.slice(last));
}

/* Immagini dei blocchi: percorso nello spazio info-immagini */
function percorsoValido(p) {
  return typeof p === 'string' && /^[A-Za-z0-9][A-Za-z0-9._\/-]{0,300}$/.test(p) && p.indexOf('..') === -1;
}
function urlImmagine(p) {
  return SB_URL + '/storage/v1/object/public/info-immagini/' + p.split('/').map(encodeURIComponent).join('/');
}

/* Blocchi liberi della pagina informativa (testo / immagine), nell'ordine scelto */
function blocchiHtml() {
  var lista = Array.isArray(ev.info_blocchi) ? ev.info_blocchi : [];
  var out = '';
  lista.forEach(function(b) {
    if (!b || typeof b !== 'object') return;
    if (b.tipo === 'testo' && b.testo && String(b.testo).trim()) {
      out += '<div class="info-blk info-txt">' + autoLink(b.testo) + '</div>';
    } else if (b.tipo === 'immagine' && percorsoValido(b.path)) {
      var url = urlImmagine(b.path);
      var did = b.didascalia ? String(b.didascalia) : '';
      out += '<figure class="info-blk info-fig"><a href="' + url + '" target="_blank" rel="noopener">'
        + '<img src="' + url + '" alt="' + esc(did || ev.nome) + '" loading="lazy"></a>'
        + (did ? '<figcaption>' + esc(did) + '</figcaption>' : '')
        + '</figure>';
    }
  });
  return out;
}

/* Scorre la pagina per mostrare un elemento, tenendo conto della barra schede ferma in alto */
function scrollAElemento(el) {
  if (!el) return;
  var bar = document.querySelector('.tabbar');
  var off = (bar ? bar.offsetHeight : 0) + 12;
  var top = el.getBoundingClientRect().top;
  if (top < off || top > window.innerHeight - 60) window.scrollTo(0, Math.max(0, top + window.pageYOffset - off));
}
function scrollASchede() {
  var s = document.getElementById('tabSentinel');
  if (!s) return;
  var top = s.getBoundingClientRect().top + window.pageYOffset;
  if (window.pageYOffset > top) window.scrollTo(0, top);
}

/* Cambio scheda (solo modalita' entrambe): le schede nascoste conservano quanto gia' scritto */
function vaiScheda(v, iniziale) {
  if (v !== 'iscrizione') v = 'info';
  ['info', 'iscrizione'].forEach(function(k) {
    var b = document.getElementById('tab_' + k);
    var p = document.getElementById('panel_' + k);
    var on = (k === v);
    if (b) { b.classList.toggle('active', on); b.setAttribute('aria-selected', on ? 'true' : 'false'); }
    if (p) p.style.display = on ? '' : 'none';
  });
  if (!iniziale) scrollASchede();
}

/* Restituisce le forme della parola in base alla terminologia scelta per l'evento */
function termWords(t) {
  var W = {
    iscrizione:     { imp: 'Iscriviti',  inf: 'iscriverti',   n: 'iscrizione',     N: 'Iscrizione',     np: 'iscrizioni',     ppl: 'Iscritti' },
    prenotazione:   { imp: 'Prenota',    inf: 'prenotare',    n: 'prenotazione',   N: 'Prenotazione',   np: 'prenotazioni',   ppl: 'Persone' },
    partecipazione: { imp: 'Partecipa',  inf: 'partecipare',  n: 'partecipazione', N: 'Partecipazione', np: 'partecipazioni', ppl: 'Partecipanti' },
    registrazione:  { imp: 'Registrati', inf: 'registrarti',  n: 'registrazione',  N: 'Registrazione',  np: 'registrazioni',  ppl: 'Partecipanti' }
  };
  return W[t] || W.iscrizione;
}

function isoToIt(iso) { if (!iso) return '--'; var p = iso.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
function isClosed(ev) {
  if (!ev || !ev.data_iso) return false;
  var t = new Date(); t.setHours(0, 0, 0, 0);
  var d = new Date(ev.data_iso); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + 1);
  return t >= d;
}

/* Legge l'ora scritta dall'organizzatore (testo libero) come la leggerebbe una persona:
   "15" = 15:00, "21.30" o "21,30" o "21h30" = 21:30, "15-19" o "dalle 15 alle 19" = dalle 15 alle 19.
   Se non si capisce restituisce null (l'evento andra' in calendario per tutto il giorno). */
function leggiOraEvento(ora) {
  var s = String(ora == null ? '' : ora).toLowerCase().replace(/[\u2013\u2014]/g, '-').replace(/\s+/g, ' ').trim();
  if (!s) return null;
  var T = '(\\d{1,2})(?:\\s?[:.,h]\\s?(\\d{2}))?';
  var re = new RegExp('^(?:dalle ore|dalle|ore|h)?\\s?' + T + '\\s?(?:h|ore)?(?:\\s?(?:-|/|fino alle|alle|a)\\s?(?:ore\\s?)?' + T + '\\s?(?:h|ore)?)?$');
  var m = s.match(re);
  if (!m) return null;
  var h1 = parseInt(m[1], 10), m1 = m[2] ? parseInt(m[2], 10) : 0;
  if (h1 > 23 || m1 > 59) return null;
  var r = { h1: h1, m1: m1, h2: null, m2: null };
  if (m[3] !== undefined) {
    var h2 = parseInt(m[3], 10), m2 = m[4] ? parseInt(m[4], 10) : 0;
    if (h2 > 24 || m2 > 59 || (h2 === 24 && m2 > 0)) return null;
    r.h2 = h2 === 24 ? 0 : h2; r.m2 = m2;
  }
  return r;
}

/* Date per il link di Google Calendar ("inizio/fine").
   Con l'ora: inizio all'ora indicata, fine all'ora di fine indicata oppure 2 ore dopo
   (se la fine cade dopo mezzanotte va al giorno dopo). Senza ora leggibile: tutto il giorno. */
function dateGCal(dataIso, ora) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(String(dataIso || ''))) return null;
  var base = new Date(dataIso + 'T00:00:00Z');
  if (isNaN(base.getTime())) return null;
  function d2(n) { return (n < 10 ? '0' : '') + n; }
  function giorno(d) { return d.getUTCFullYear() + d2(d.getUTCMonth() + 1) + d2(d.getUTCDate()); }
  function giornoOra(d) { return giorno(d) + 'T' + d2(d.getUTCHours()) + d2(d.getUTCMinutes()) + '00'; }
  var t = leggiOraEvento(ora);
  if (!t) return giorno(base) + '/' + giorno(new Date(base.getTime() + 86400000));
  var ini = new Date(base.getTime() + (t.h1 * 60 + t.m1) * 60000);
  var fin;
  if (t.h2 !== null) {
    fin = new Date(base.getTime() + (t.h2 * 60 + t.m2) * 60000);
    if (fin.getTime() <= ini.getTime()) fin = new Date(fin.getTime() + 86400000);
  } else {
    fin = new Date(ini.getTime() + 2 * 3600000);
  }
  return giornoOra(ini) + '/' + giornoOra(fin);
}

/* Costruisce link Google Calendar con dati evento */
function buildGCalLink(ev) {
  if (!ev || !ev.data_iso) return null;
  var dates = dateGCal(ev.data_iso, ev.ora);
  if (!dates) return null;
  var params = new URLSearchParams({
    action: 'TEMPLATE',
    text: ev.nome,
    dates: dates,
    details: (ev.descrizione || '') + '\n\n' + termWords(ev.terminologia).N + ' gestita con EventsFun -- eventsfun.com',
    location: ev.evento_online ? ('Evento online' + (ev.luogo ? ' - ' + ev.luogo : '')) : (ev.luogo || '')
  });
  return 'https://calendar.google.com/calendar/render?' + params.toString();
}

/* ============================================================
   INIT
   ============================================================ */
async function init() {
  var params = new URLSearchParams(window.location.search);
  var evSlug = params.get('slug');
  var evId = params.get('id');
  if (!evSlug && !evId) { showError('Link non valido', 'Questo link non contiene un evento valido.'); return; }
  try {
    /* Priorita' a slug; fallback su id per retrocompatibilita' con link vecchi */
    var evs;
    if (evSlug) {
      evs = await sbGet('events_public', { slug: evSlug }, '*');
    } else {
      evs = await sbGet('events_public', { id: evId }, '*');
    }
    if (!evs || !evs.length) { showError('Evento non trovato', 'L\'evento che stai cercando non esiste o è stato rimosso.'); return; }
    ev = evs[0];
    /* Punto Info scaduto: pagina sospesa (torna visibile da sola se l'organizzatore si riabbona) */
    if (ev.pagina_sospesa === true) { showError('Pagina non disponibile', 'Questa pagina al momento non è disponibile.'); return; }
    /* Il parametro ?tema= nell'URL ha la precedenza sul valore salvato su DB --
       permette all'anteprima di mostrare il tema scelto prima del salvataggio */
    var temaParam = new URLSearchParams(window.location.search).get('tema');
    var temaFinale = temaParam || ev.landing_tema || 'chiaro';
    if (temaFinale === 'scuro') document.body.classList.add('dark');
    cap = await fetchCapacity(ev.id);
    document.title = ev.nome + ' -- EventsFun';
    render();
  } catch(e) {
    showError('Errore di caricamento', 'Non è stato possibile caricare l\'evento. Riprova tra qualche secondo.');
  }
}

/* ============================================================
   RENDER
   ============================================================ */
function render() {
  var app = document.getElementById('app');
  var closed = isClosed(ev) || !ev.attivo;
  var TW = termWords(ev.terminologia);
  var modo = modalitaEvento();
  document.title = (modo === 'info') ? TXT_INFO.titoloPagina : TW.N + ' evento -- EventsFun';

  if (modo !== 'iscrizioni') { renderConInfo(modo, closed, TW); return; }

  /* Sola iscrizioni: pagina identica a prima */
  app.innerHTML = headerCardHtml(true)
    + buildCapHtml(TW)
    + '<div class="card">' + buildRegFormHtml(closed, TW) + '</div>'
    + buildSponsorsHtml()
    + footerHtml('iscrizioni');
}

    html = headerCardHtml(true)
      + (blk ? '<div class="card">' + blk + '</div>' : '')
      + richiestaCard;
  } else {
    var contenuto = descrizioneHtml() + blocchiHtml();
    html = headerCardHtml(false)
      + '<div id="tabSentinel"></div>'
      + '<div class="tabbar" role="tablist">'
      +   '<button type="button" role="tab" class="tab-btn" id="tab_info" aria-controls="panel_info" onclick="vaiScheda(\'info\')">' + TXT_INFO.tabInfo + '</button>'
      +   '<button type="button" role="tab" class="tab-btn" id="tab_iscrizione" aria-controls="panel_iscrizione" onclick="vaiScheda(\'iscrizione\')">' + TW.imp + '</button>'
      + '</div>'
      + '<div class="tab-panel" id="panel_info" role="tabpanel">'
      +   (contenuto ? '<div class="card">' + contenuto + '</div>' : '')
      +   richiestaCard
      +   (closed ? '' : '<div class="card info-cta" id="richiamoIscr"><p>' + TXT_INFO.richiamoIscr + '</p><button type="button" class="tab-link-btn" onclick="vaiScheda(\'iscrizione\')">' + TW.imp + ' &rarr;</button></div>')
      + '</div>'
      + '<div class="tab-panel" id="panel_iscrizione" role="tabpanel">'
      +   '<div id="capWrap">' + buildCapHtml(TW) + '</div>'
      +   '<div class="card" id="regCard">' + buildRegFormHtml(closed, TW) + '</div>'
      + '</div>';
  }
  app.innerHTML = html + buildSponsorsHtml() + footerHtml(modo);
  if (modo === 'entrambe') vaiScheda(schedaIniziale(), true);
  if (!closed) aggiornaCanale();
}

/* Modulo richiesta informazioni */
function richiestaFormHtml(modo, closed) {
  if (closed) return '<div class="closed-box">⛔ ' + TXT_INFO.chiuso + '</div>';
  var titolo = (modo === 'entrambe') ? TXT_INFO.titoloEntrambe : TXT_INFO.titoloInfo;
  function opz(val, etichetta, sel) {
    return '<label class="ch-opt"><input type="radio" name="q_canale" value="' + val + '"' + (sel ? ' checked' : '') + ' onchange="aggiornaCanale()"><span>' + etichetta + '</span></label>';
  }
  return '<h2 class="form-title" style="margin-bottom:6px">' + titolo + '</h2>'
    + '<p class="info-sub">' + TXT_INFO.sottotitolo + '</p>'
    + '<div class="alert" id="infoAlert"></div>'
    + '<div class="lp-fg"><label class="lp-lbl" for="q_nome">' + TXT_INFO.lblNome + ' *</label><input id="q_nome" class="lp-inp" maxlength="120" autocomplete="name" placeholder="Mario Rossi"></div>'
    + '<div class="lp-fg"><span class="lp-lbl">' + TXT_INFO.lblCanale + ' *</span><div class="ch-group" role="radiogroup">'
    +   opz('telefono', TXT_INFO.chTelefono, true) + opz('whatsapp', TXT_INFO.chWhatsapp, false) + opz('email', TXT_INFO.chEmail, false)
    + '</div></div>'
    + '<div class="lp-grid">'
    + '<div class="lp-fg"><label class="lp-lbl" for="q_tel" id="q_tel_lbl">' + TXT_INFO.lblTel + '</label><input id="q_tel" class="lp-inp" type="tel" inputmode="tel" maxlength="40" autocomplete="tel" placeholder="333 0000000"></div>'
    + '<div class="lp-fg"><label class="lp-lbl" for="q_email" id="q_email_lbl">' + TXT_INFO.lblEmail + '</label><input id="q_email" class="lp-inp" type="email" inputmode="email" maxlength="254" autocomplete="email" placeholder="La tua email"></div>'
    + '</div>'
    + '<div class="lp-fg"><label class="lp-lbl" for="q_msg">' + TXT_INFO.lblMsg + '</label><textarea id="q_msg" class="lp-inp" rows="4" maxlength="2000" placeholder="' + TXT_INFO.phMsg + '" style="resize:vertical;font-family:inherit;font-size:14px;line-height:1.5;padding:10px 12px"></textarea></div>'
    + '<label class="lp-nl" style="margin-top:6px"><input type="checkbox" id="q_gdpr" style="accent-color:#C9A96E;width:15px;height:15px"> <span>' + TXT_INFO.consensoPre + '<a href="https://eventsfun.com/privacy.html" target="_blank" style="color:#C9A96E;text-decoration:underline">' + TXT_INFO.consensoLink + '</a> *</span></label>'
    + '<button class="submit-btn" id="infoBtn" onclick="submitRichiesta()">' + TXT_INFO.btnInvia + ' &rarr;</button>';
}

function canaleScelto() {
  var r = document.querySelector('input[name="q_canale"]:checked');
  return r ? r.value : 'telefono';
}

/* Asterischi dei recapiti in base al canale scelto (e all'email obbligatoria dell'organizzatore) */
function aggiornaCanale() {
  var c = canaleScelto();
  var telObb = (c === 'telefono' || c === 'whatsapp');
  var mailObb = (c === 'email') || !!ev.info_email_obbligatoria;
  var lt = document.getElementById('q_tel_lbl');
  var le = document.getElementById('q_email_lbl');
  if (lt) lt.textContent = TXT_INFO.lblTel + (telObb ? ' *' : '');
  if (le) le.textContent = TXT_INFO.lblEmail + (mailObb ? ' *' : '');
}

/* Invio richiesta informazioni */
async function submitRichiesta() {
  function val(id) { var el = document.getElementById(id); return el ? (el.value || '').trim() : ''; }
  var nome = val('q_nome'), tel = val('q_tel'), email = val('q_email'), msg = val('q_msg');
  var canale = canaleScelto();
  var g = document.getElementById('q_gdpr');
  var consenso = !!(g && g.checked);
  var reMail = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;
  var errore = '';
  if (!nome) errore = TXT_INFO.errNome;
  else if ((canale === 'telefono' || canale === 'whatsapp') && !tel) errore = TXT_INFO.errTel;
  else if (tel && !/[0-9]/.test(tel)) errore = TXT_INFO.errTelVal;
  else if ((canale === 'email' || ev.info_email_obbligatoria) && !email) errore = TXT_INFO.errEmail;
  else if (email && !reMail.test(email)) errore = TXT_INFO.errEmailVal;
  else if (!consenso) errore = TXT_INFO.errConsenso;
  if (errore) { showAlert(errore, 'infoAlert'); scrollAElemento(document.getElementById('infoAlert')); return; }

  var btn = document.getElementById('infoBtn');
  btn.disabled = true; btn.textContent = TXT_INFO.invio;
  try {
    await sbInsert('richieste_contatto', {
      event_id: ev.id,
      nome: nome.slice(0, 120),
      telefono: tel ? tel.slice(0, 40) : null,
      email: email ? email.slice(0, 254) : null,
      canale_preferito: canale,
      messaggio: msg ? msg.slice(0, 2000) : null,
      consenso: true
    });
    showRichiestaOk(nome, canale);
  } catch (e) {
    btn.disabled = false; btn.innerHTML = TXT_INFO.btnInvia + ' &rarr;';
    showAlert(TXT_INFO.errInvio, 'infoAlert');
    scrollAElemento(document.getElementById('infoAlert'));
  }
}

/* Conferma richiesta: sostituisce SOLO il modulo, le informazioni restano leggibili */
function showRichiestaOk(nome, canale) {
  var card = document.getElementById('richiestaCard');
  if (!card) return;
  var TW = termWords(ev.terminologia);
  var cta = '';
  if (modalitaEvento() === 'entrambe' && !(isClosed(ev) || !ev.attivo)) {
    cta = '<div class="ok-cta"><p>' + TXT_INFO.vuoiAnche.replace('{azione}', TW.inf) + '</p>'
      + '<button type="button" class="tab-link-btn" onclick="vaiScheda(\'iscrizione\')">' + TW.imp + ' &rarr;</button></div>';
  }
  card.innerHTML = '<div class="success-box">'
    + '<div class="success-icon">✉️</div>'
    + '<h2>' + TXT_INFO.okTitolo.replace('{nome}', esc(nome)) + '</h2>'
    + '<p>' + TXT_INFO.okTesto.replace('{evento}', ev.nome).replace('{canale}', TXT_INFO.okCanale[canale] || '') + '</p>'
    + cta
    + '</div>';
  var r = document.getElementById('richiamoIscr');
  if (r) r.style.display = 'none';
  scrollAElemento(card);
}

/* ============================================================
   COUNTER + ACCOMPAGNATORI
   ============================================================ */
function changeCount(field, delta) {
  if (field === 'adulti') {
    adultiCount = Math.max(1, adultiCount + delta);
    document.getElementById('cnt_adulti').textContent = adultiCount;
    updateAccompagnatoriForm();
  } else {
    bambiniCount = Math.max(0, bambiniCount + delta);
    document.getElementById('cnt_bambini').textContent = bambiniCount;
  }
}

function updateAccompagnatoriForm() {
  var wrap = document.getElementById('accompagnatori-wrap');
  if (!wrap) return;
  var num = adultiCount - 1;
  if (num <= 0) { wrap.innerHTML = ''; return; }

  var emailObb = ev.opt_accompagnatori_email_obbligatoria ? ' *' : '';
  var telObb = ev.opt_accompagnatori_telefono_obbligatorio ? ' *' : '';

  var html = '<hr class="acc-sep">';
  for (var i = 1; i <= num; i++) {
    html += '<div class="acc-block" id="acc-block-' + i + '">';
    html += '<div class="acc-title">Accompagnatore ' + i + '</div>';
    html += '<div class="lp-grid">';
    html += '<div class="lp-fg"><label class="lp-lbl">Nome *</label><input id="acc_' + i + '_nome" class="lp-inp" placeholder="Mario"></div>';
    html += '<div class="lp-fg"><label class="lp-lbl">Cognome *</label><input id="acc_' + i + '_cognome" class="lp-inp" placeholder="Rossi"></div>';
    html += '</div>';
    html += '<div class="lp-grid">';
    html += '<div class="lp-fg"><label class="lp-lbl">Email' + emailObb + '</label><input id="acc_' + i + '_email" class="lp-inp" type="email" placeholder="Email dell\'accompagnatore"></div>';
    html += '<div class="lp-fg"><label class="lp-lbl">Telefono' + telObb + '</label><input id="acc_' + i + '_tel" class="lp-inp" placeholder="333 0000000"></div>';
    html += '</div>';
    html += '</div>';
  }
  wrap.innerHTML = html;
}

/* ============================================================
   SUBMIT
   ============================================================ */
async function submitReg() {
  var nome = (document.getElementById('r_nome').value || '').trim();
  var cognome = (document.getElementById('r_cognome').value || '').trim();
  var email = (document.getElementById('r_email').value || '').trim();
  var gdpr = document.getElementById('r_gdpr').checked;

  if (!nome || !cognome || !email) { showAlert('Compila i campi obbligatori: Nome, Cognome ed Email.'); return; }
  if (!email.includes('@')) { showAlert('Inserisci un indirizzo email valido.'); return; }
  if (!gdpr) { showAlert('Devi accettare il trattamento dei dati per procedere.'); return; }

  /* Validazione accompagnatori */
  var numAcc = ev.opt_multipla ? adultiCount - 1 : 0;
  var accompagnatori = [];
  for (var i = 1; i <= numAcc; i++) {
    var accNome = (document.getElementById('acc_' + i + '_nome').value || '').trim();
    var accCognome = (document.getElementById('acc_' + i + '_cognome').value || '').trim();
    var accEmail = (document.getElementById('acc_' + i + '_email').value || '').trim();
    var accTel = (document.getElementById('acc_' + i + '_tel').value || '').trim();
    if (!accNome || !accCognome) { showAlert('Compila Nome e Cognome di tutti gli accompagnatori.'); return; }
    if (ev.opt_accompagnatori_email_obbligatoria && !accEmail) { showAlert('L\'email è obbligatoria per tutti gli accompagnatori.'); return; }
    if (accEmail && !accEmail.includes('@')) { showAlert('Inserisci un\'email valida per l\'accompagnatore ' + i + '.'); return; }
    if (ev.opt_accompagnatori_telefono_obbligatorio && !accTel) { showAlert('Il telefono è obbligatorio per tutti gli accompagnatori.'); return; }
    accompagnatori.push({ nome: accNome, cognome: accCognome, email: accEmail, telefono: accTel });
  }

  var btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = 'Invio in corso...';

  var cf = ev.custom_fields || [], extra = {};
  cf.forEach(function(f) {
    if (f.type === 'checkbox') {
      var checked = [];
      (f.options || []).forEach(function(o) {
        var cb = document.getElementById('rxcb_' + f.id + '_' + o.replace(/\s+/g,'_'));
        if (cb && cb.checked) checked.push(o);
      });
      extra[f.id] = checked;
    } else {
      var el = document.getElementById('rx_' + f.id);
      if (el) extra[f.id] = el.value.trim();
    }
  });

  var rt = document.getElementById('r_tipo');
  var rp = document.getElementById('r_pranzo');
  var rc = document.getElementById('r_cena');
  var rn = document.getElementById('r_newsletter');

  /* Lista d'attesa: capienza piena = iscrizione salvata con flag in_lista_attesa */
  /* Rilegge la capienza in tempo reale dal canale posti pubblico (solo numeri, nessun dato personale) */
  var freshCap = await fetchCapacity(ev.id);
  var capienzaPiena = !!freshCap.piena;

  var regId = genId();
  var regData = {
    id: regId,
    event_id: ev.id,
    nome: nome, cognome: cognome, email: email,
    telefono: (document.getElementById('r_tel').value || '').trim(),
    adulti: ev.opt_multipla ? adultiCount : 1,
    bambini: ev.opt_multipla ? bambiniCount : 0,
    tipo: rt ? rt.value : 'visitatore',
    pranzo: rp ? rp.checked : false,
    cena: rc ? rc.checked : false,
    newsletter: rn ? rn.checked : false,
    extra: extra,
    presente: false,
    in_lista_attesa: !!capienzaPiena
  };

  try {
    /* Salva iscrizione capogruppo (id generato lato client: nessuna rilettura necessaria) */
    await sbInsert('registrations', regData);

    /* Email conferma capogruppo (non bloccante) */
    if (regId) {
      fetch(SB_URL + '/functions/v1/send-reg-confirmation', {
        method: 'POST',
        headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ registration_id: regId, event_id: ev.id, nome: nome, cognome: cognome, email: email, in_lista_attesa: !!capienzaPiena })
      }).catch(function(e) { console.warn('Email conferma capogruppo non inviata:', e); });
    }

    /* Salva accompagnatori e invia loro email individuale */
    for (var j = 0; j < accompagnatori.length; j++) {
      var acc = accompagnatori[j];
      var accRegId = genId();
      var accData = {
        id: accRegId,
        event_id: ev.id,
        nome: acc.nome, cognome: acc.cognome,
        email: acc.email || null,
        telefono: acc.telefono || null,
        adulti: 1, bambini: 0,
        tipo: rt ? rt.value : 'visitatore',
        pranzo: rp ? rp.checked : false,
        cena: rc ? rc.checked : false,
        newsletter: false,
        extra: {},
        presente: false,
        in_lista_attesa: !!capienzaPiena,
        capogruppo_id: regId || null
      };
      try {
        await sbInsert('registrations', accData);
        /* Email individuale solo se l'accompagnatore ha un'email valida */
        if (accRegId && acc.email && acc.email.includes('@')) {
          fetch(SB_URL + '/functions/v1/send-reg-confirmation', {
            method: 'POST',
            headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' },
            body: JSON.stringify({ registration_id: accRegId, event_id: ev.id, nome: acc.nome, cognome: acc.cognome, email: acc.email, in_lista_attesa: !!capienzaPiena })
          }).catch(function(e) { console.warn('Email conferma accompagnatore non inviata:', e); });
        }
      } catch(accErr) {
        console.warn('Errore salvataggio accompagnatore ' + (j + 1) + ':', accErr);
      }
    }

    showSuccess(nome, !!capienzaPiena);
  } catch(e) {
    btn.disabled = false; btn.textContent = termWords(ev.terminologia).imp + ' →';
    showAlert('Si è verificato un errore. Riprova tra qualche secondo.');
  }
}

function showAlert(msg, id) {
  var a = document.getElementById(id || 'formAlert'); if (!a) return;
  a.textContent = '⚠️ ' + msg; a.style.display = 'block';
  setTimeout(function() { a.style.display = 'none'; }, 5000);
}

function showSuccess(nome, inAttesa) {
  var TW = termWords(ev.terminologia);
  var titoloTxt = inAttesa ? 'Sei in lista d\'attesa!' : 'Grazie, ' + nome + '!';
  var iconaTxt = inAttesa ? '⏳' : '🎉';
  var testoTxt = inAttesa
    ? 'La tua richiesta per <strong>' + ev.nome + '</strong> è stata ricevuta.<br>L\'evento è al completo, ma sei in lista d\'attesa: se si libera un posto ti contatteremo via email.'
    : 'La tua ' + TW.n + ' a <strong>' + ev.nome + '</strong> è confermata.<br>Riceverai una email di conferma a breve.<br>Ci vediamo il <strong>' + isoToIt(ev.data_iso) + '</strong>' + (ev.evento_online ? ' <strong>online</strong>' + (ev.luogo ? ' su <strong>' + ev.luogo + '</strong>' : '') : (ev.luogo ? ' a <strong>' + ev.luogo + '</strong>' : '')) + '.';
  var gcalSuccessHtml = !inAttesa ? '<div style="margin-top:24px;display:flex;flex-direction:column;align-items:center">' + waShareBtnHtml(ev) + gcalBtnHtml(ev) + '</div>' : '';
  if (modalitaEvento() === 'entrambe') {
    var regCard = document.getElementById('regCard');
    var capWrap = document.getElementById('capWrap');
    if (capWrap) capWrap.style.display = 'none';
    if (regCard) {
      regCard.innerHTML = '<div class="success-box">'
        + '<div class="success-icon">' + iconaTxt + '</div>'
        + '<h2>' + titoloTxt + '</h2>'
        + '<p>' + testoTxt + '</p>'
        + gcalSuccessHtml
        + '<div class="ok-cta"><button type="button" class="tab-link-btn" onclick="vaiScheda(\'info\')">' + TXT_INFO.rivedi + '</button></div>'
        + '</div>';
      scrollASchede();
      return;
    }
  }
  document.getElementById('app').innerHTML = '<div class="card"><div class="success-box">'
    + '<div class="success-icon">' + iconaTxt + '</div>'
    + '<h2>' + titoloTxt + '</h2>'
    + '<p>' + testoTxt + '</p>'
    + gcalSuccessHtml
    + '</div></div>'
    + '<div class="ef-footer"><div class="ef-gdpr">I dati di questa iscrizione sono raccolti e gestiti esclusivamente dall\'organizzatore dell\'evento. Nessun marketplace, nessun uso da parte di terzi.</div><a href="https://eventsfun.com" target="_blank" class="ef-badge"><div class="ef-badge-inner"><span class="ef-name">Events<span>Fun</span></span><span class="ef-sub">Gestito con EventsFun</span></div><div class="ef-cta">Vuoi organizzare il tuo evento? &rarr;</div></a></div>';
}

function showError(title, msg) {
  document.getElementById('app').innerHTML = '<div class="card"><div class="err-box">'
    + '<div style="font-size:48px;margin-bottom:16px">🔍</div>'
    + '<h2>' + title + '</h2>'
    + '<p>' + msg + '</p>'
    + '<p style="margin-top:16px"><a href="https://eventsfun.com" style="color:#C9A96E;font-weight:600">← Torna a EventsFun</a></p>'
    + '</div></div>';
}

/* START */
init();
</script>

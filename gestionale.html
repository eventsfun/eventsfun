<!DOCTYPE html>
<!-- EventsFun | Gestionale | v2.3 06/10/2026: sezione Fatture (fatture elettroniche da caricare sul portale Fatture e Corrispettivi, portiere gestionale-fatture v1), scheda cliente a schede con dati di fatturazione e fatture, fatture e documento Stripe negli Incassi, fatture tra le cose da fare. v2.2 04/10/2026: notifiche push su questo dispositivo (Altro e Notifiche), installabile come app (gestionale.webmanifest + gestionale-sw.js), azioni in Da controllare (Segna come controllato, Elimina, Riprova, Controllate). Azioni nuove dal portiere gestionale-azioni v1. v2.1 04/10/2026: allegati scaricati direttamente, Prove e omaggi sempre visibili, niente pulsante CSV spento. v2.0 (C7): Riepilogo, Clienti con stati veri, Scheda cliente, Incassi, Assistenza con risposte, Messaggi dal sito, Eventi, Venditori, Newsletter, Da controllare. Dati dal portiere gestionale-api v9. -->
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A0A0A">
<title>Gestionale EventsFun</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="gestionale.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0A0A; --card:#121212; --card2:#171717; --nav:#0d0d0d;
  --gold:#C9A96E; --gold2:#E2C792;
  --txt:rgb(245,240,232); --muted:rgba(245,240,232,0.75); --dim:rgba(245,240,232,0.6); --faint:rgba(245,240,232,0.45);
  --line:rgba(245,240,232,0.12); --line2:rgba(245,240,232,0.08);
  --ok:#4ADE80; --warn:#FBBF24; --bad:#F87171; --base:#7DD3FC; --ag:#C4B5FD; --info:#5EEAD4;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--txt);font-family:'DM Sans',system-ui,sans-serif;font-size:14px;line-height:1.45;min-height:100vh}
a{color:var(--gold)}a:hover{color:var(--gold2)}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none !important}

/* ---------- accesso ---------- */
.splash{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--dim)}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.login-box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 22px}
.login-box h1{font-family:'Syne',sans-serif;font-weight:800;font-size:22px;margin:0 0 6px}
.login-box h1 span{color:var(--gold)}
.login-box p{margin:0 0 20px;color:var(--dim);font-size:13px}

/* ---------- barra in alto ---------- */
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));background:rgba(10,10,10,0.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{font-family:'Syne',sans-serif;font-weight:800;font-size:17px;color:var(--txt);text-decoration:none}
.brand span{color:var(--gold)}
.who{font-size:12px;color:var(--dim);margin-top:2px}
.top-act{display:flex;gap:8px}
.ibtn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:10px;border:1px solid rgba(245,240,232,0.14);background:transparent;color:rgba(245,240,232,0.8);cursor:pointer;padding:0;flex-shrink:0}
.ibtn:hover{border-color:rgba(201,169,110,0.5);color:var(--gold)}
.ibtn.gira svg{animation:gira 0.9s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}

/* ---------- impaginazione ---------- */
.shell{display:block}
.side{display:none}
.vista{max-width:720px;margin:0 auto;padding:0 0 calc(96px + env(safe-area-inset-bottom))}
.sec{padding:18px 16px 4px}
.h1{font-family:'Syne',sans-serif;font-weight:800;font-size:22px;line-height:1.2;margin:0;word-break:break-word}
.h2{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;margin:0 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.h2 small{font-family:'DM Sans',sans-serif;font-weight:500;font-size:12px;color:var(--dim)}
.tag{font-size:12px;color:var(--dim)}
.note{font-size:12.5px;color:rgba(245,240,232,0.65);line-height:1.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.card.gold{border-color:rgba(201,169,110,0.55);background:#14110c}
.card.pad{padding:14px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line2);text-decoration:none;color:var(--txt);min-height:44px}
.row:first-child{border-top:0}
a.row:hover,button.row:hover{background:rgba(245,240,232,0.04);color:var(--txt)}
button.row{width:100%;background:transparent;border-left:0;border-right:0;border-bottom:0;font:inherit;text-align:left;cursor:pointer}
.card > button.row:first-child{border-top:0}
.row.top-al{align-items:flex-start}
.grow{flex:1;min-width:0}
.t{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t.wrap{white-space:normal;word-break:break-word}
.s{font-size:12px;color:rgba(245,240,232,0.62);margin-top:2px;word-break:break-word}
.s.chiaro{color:rgba(245,240,232,0.82)}
.estratto{font-size:12.5px;color:rgba(245,240,232,0.72);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.chev{color:rgba(245,240,232,0.4);flex-shrink:0;display:flex}
.importo{font-weight:700;white-space:nowrap;text-align:right}
.vuoto{padding:16px 14px;color:var(--dim);font-size:13px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-block;border-radius:999px;padding:2px 8px;font-size:10.5px;font-weight:700;letter-spacing:0.3px;white-space:nowrap;line-height:1.5}
.p-base{background:rgba(125,211,252,0.15);color:var(--base);border:1px solid rgba(125,211,252,0.35)}
.p-pro{background:rgba(201,169,110,0.15);color:var(--gold);border:1px solid rgba(201,169,110,0.4)}
.p-ag{background:rgba(196,181,253,0.15);color:var(--ag);border:1px solid rgba(196,181,253,0.35)}
.p-info{background:rgba(94,234,212,0.13);color:var(--info);border:1px solid rgba(94,234,212,0.35)}
.p-ok{background:rgba(74,222,128,0.14);color:var(--ok);border:1px solid rgba(74,222,128,0.32)}
.p-warn{background:rgba(251,191,36,0.14);color:var(--warn);border:1px solid rgba(251,191,36,0.32)}
.p-bad{background:rgba(248,113,113,0.14);color:var(--bad);border:1px solid rgba(248,113,113,0.32)}
.p-neu{background:rgba(245,240,232,0.08);color:var(--muted);border:1px solid rgba(245,240,232,0.14)}
.p-gold{background:var(--gold);color:#0A0A0A;border:1px solid var(--gold)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px;flex-shrink:0}
.d-ok{background:var(--ok)}.d-warn{background:var(--warn)}.d-bad{background:var(--bad)}.d-neu{background:rgba(245,240,232,0.45)}.d-gold{background:var(--gold)}
.nums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.num{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-decoration:none;color:var(--txt);display:block;min-width:0}
.num:hover{border-color:rgba(201,169,110,0.45);color:var(--txt)}
.num .n{font-family:'Syne',sans-serif;font-weight:800;font-size:24px;color:var(--gold);line-height:1.1;word-break:break-word}
.num .l{font-size:12px;color:rgba(245,240,232,0.7);margin-top:4px}
.num .x{font-size:11.5px;color:rgba(245,240,232,0.55);margin-top:6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;background:var(--card);border:1px solid rgba(245,240,232,0.14);color:rgba(245,240,232,0.8);border-radius:999px;padding:0 14px;height:38px;font-family:'Syne',sans-serif;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap;text-decoration:none}
.chip b{font-family:'DM Sans',sans-serif;font-size:11px;opacity:0.75}
.chip.on{background:var(--gold);border-color:var(--gold);color:#0A0A0A}
.chip.filtro{border-color:rgba(201,169,110,0.55);color:var(--gold)}
.field{display:block;width:100%;background:var(--card);border:1px solid rgba(245,240,232,0.14);border-radius:10px;padding:12px 14px;color:var(--txt);font-size:16px;min-height:44px}
.field:focus{border-color:rgba(201,169,110,0.6);outline:none}
textarea.field{resize:vertical;min-height:96px;line-height:1.5}
select.field{appearance:auto}
input[type=date].field{color-scheme:dark}
.lbl{display:block;font-size:12px;color:rgba(245,240,232,0.7);margin-bottom:6px;font-weight:500}
.campo{margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;border:0;background:var(--gold);color:#0A0A0A;font-family:'Syne',sans-serif;font-weight:700;font-size:14px;text-decoration:none;cursor:pointer;text-align:center}
.btn:hover{background:var(--gold2);color:#0A0A0A}
.btn.sec2{background:transparent;color:var(--txt);border:1px solid rgba(245,240,232,0.2)}
.btn.sec2:hover{border-color:rgba(201,169,110,0.55);color:var(--gold)}
.btn.rosso{background:transparent;color:var(--bad);border:1px solid rgba(248,113,113,0.4)}
.btn.piccolo{min-height:36px;padding:0 12px;font-size:12.5px}
.btn:disabled{opacity:0.55;cursor:default}
.btn.pieno{width:100%}
.bottoni{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;color:rgba(245,240,232,0.75);text-decoration:none;font-size:14px;padding:0 16px}
.back:hover{color:var(--gold)}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line2)}
.kv > div{background:var(--card);padding:11px 14px;min-width:0}
.k{font-size:11px;color:var(--dim)}
.v{font-size:14px;font-weight:700;margin-top:2px;word-break:break-word}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.seg.q4{grid-template-columns:repeat(2,minmax(0,1fr))}
.seg button{min-height:44px;border-radius:10px;border:1px solid rgba(245,240,232,0.14);background:var(--card);color:rgba(245,240,232,0.8);font-family:'Syne',sans-serif;font-weight:600;font-size:13px;cursor:pointer;padding:4px 6px}
.seg button b{font-family:'DM Sans',sans-serif;font-size:11px;opacity:0.75;margin-left:4px}
.seg button.on{background:var(--gold);border-color:var(--gold);color:#0A0A0A}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;font-size:14px;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--gold);flex-shrink:0}
.msgx{display:none;margin-top:10px;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.5}
.msgx.err{display:block;background:rgba(248,113,113,0.1);border:1px solid rgba(248,113,113,0.35);color:#fca5a5}
.msgx.ok{display:block;background:rgba(74,222,128,0.1);border:1px solid rgba(74,222,128,0.32);color:#86efac}
.msgx.info{display:block;background:rgba(245,240,232,0.05);border:1px solid var(--line);color:var(--muted)}
.caricamento{padding:40px 16px;text-align:center;color:var(--dim)}

/* conversazione */
.bolla{border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.5;margin-bottom:10px}
.b-in{background:var(--card2);border:1px solid var(--line);margin-right:28px}
.b-out{background:rgba(201,169,110,0.12);border:1px solid rgba(201,169,110,0.35);margin-left:28px}
.bh{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--dim);margin-bottom:6px;flex-wrap:wrap}
.btesto{white-space:pre-wrap;word-break:break-word}
.allegati{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.allegato{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid rgba(245,240,232,0.2);background:transparent;color:var(--txt);font-size:12.5px;cursor:pointer;max-width:100%}
.allegato span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.allegato:hover{border-color:var(--gold);color:var(--gold)}

/* pagamenti apribili */
details.pag{border-top:1px solid var(--line2)}
.card > details.pag:first-child{border-top:0}
details.pag > summary{list-style:none;cursor:pointer}
details.pag > summary::-webkit-details-marker{display:none}
details.pag[open] > summary{background:rgba(245,240,232,0.03)}
.pag-det{padding:4px 14px 14px;font-size:12.5px;color:var(--muted)}
.pag-det .riga{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px dashed var(--line2)}
.pag-det .bottoni{margin-top:12px}
details.blocco{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
details.blocco > summary{list-style:none;cursor:pointer;padding:12px 14px;min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:700}
details.blocco > summary::-webkit-details-marker{display:none}
details.blocco > summary::after{content:'';width:8px;height:8px;border-right:2px solid var(--dim);border-bottom:2px solid var(--dim);transform:rotate(45deg);margin-right:4px;flex-shrink:0}
details.blocco[open] > summary::after{transform:rotate(-135deg)}

/* newsletter e venditori */
.nl-check{display:flex;align-items:center;gap:10px;min-height:44px;padding:4px 14px;border-top:1px solid var(--line2);cursor:pointer}
.nl-check:first-child{border-top:0}
.nl-check input{width:20px;height:20px;accent-color:var(--gold);flex-shrink:0}
.nl-check .grow{font-size:14px}
.nl-n{font-weight:700;color:var(--gold)}
.nl-lista{max-height:320px;overflow-y:auto;border-top:1px solid var(--line2)}
.nl-dest{display:flex;align-items:center;gap:10px;padding:8px 14px;border-top:1px solid var(--line2);cursor:pointer}
.nl-dest:first-child{border-top:0}
.nl-dest input{width:18px;height:18px;accent-color:var(--gold);flex-shrink:0}
.nl-badge{display:inline-block;font-size:10px;padding:1px 6px;border-radius:999px;background:rgba(245,240,232,0.08);color:var(--muted);margin-left:4px}
.tok{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;color:var(--dim);word-break:break-all}

/* barra in basso (telefono e tablet) */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:50;height:calc(68px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--nav);border-top:1px solid var(--line)}
.nav a{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;color:rgba(245,240,232,0.6);text-decoration:none;min-width:0}
.nav a.on{color:var(--gold)}
.nb{position:absolute;top:6px;left:50%;margin-left:6px;background:var(--bad);color:#fff;border-radius:999px;font-size:10px;font-weight:700;padding:1px 6px;line-height:1.4}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;background:#1d1a14;border:1px solid rgba(201,169,110,0.5);color:var(--txt);border-radius:12px;padding:10px 16px;font-size:13.5px;max-width:calc(100% - 32px);box-shadow:0 8px 30px rgba(0,0,0,0.5);display:none}
.toast.on{display:block}
.toast.err{border-color:rgba(248,113,113,0.6)}

/* Da controllare: azioni */
.an{border-top:1px solid var(--line2)}
.card > .an:first-child{border-top:0}
.an > .row{border-top:0}
.an-az{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:0 14px 12px}
.an-az .s{width:100%;margin:0 0 2px}
details.blocco .an:first-of-type{border-top:1px solid var(--line2)}
/* notifiche su questo dispositivo */
.blk{padding:14px}
.blk .note{margin-bottom:12px}
.blk .note:last-child{margin-bottom:0}

/* riepilogo a due colonne sul computer */
.rgrid{display:block}

@media (min-width:900px){
  .top{padding:14px 24px}
  .shell{display:flex;gap:24px;max-width:1360px;margin:0 auto;padding:24px}
  .side{display:flex;flex-direction:column;gap:4px;flex:0 0 220px;position:sticky;top:96px;align-self:flex-start}
  .side a{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:42px;padding:0 12px;border-radius:9px;text-decoration:none;font-size:14px;font-weight:500;color:rgba(245,240,232,0.78)}
  .side a:hover{background:rgba(245,240,232,0.04);color:var(--txt)}
  .side a.on{background:rgba(201,169,110,0.14);color:var(--gold)}
  .side hr{border:0;border-top:1px solid var(--line);margin:8px 0;width:100%}
  .vista{flex:1;min-width:0;max-width:1060px;margin:0;padding:0 0 40px}
  .vista .sec{padding-left:0;padding-right:0}
  .vista .chips{padding-left:0;padding-right:0}
  .vista .back{padding-left:0}
  .nav{display:none}
  .toast{bottom:28px}
  .nums.q4{grid-template-columns:repeat(4,minmax(0,1fr))}
  .rgrid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:0 24px;align-items:start}
  .stretta{max-width:760px}
}
/* ---------- v2.3 fatture e scheda cliente ---------- */
.chips.schede{flex-wrap:wrap;overflow-x:visible}
.campi2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 10px}
.campi3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr) minmax(0,0.8fr);gap:0 10px}
.err-campo{font-size:12px;color:#fca5a5;margin-top:4px}
.field.sbagliato{border-color:rgba(248,113,113,0.7)}
.avviso{border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.5;background:rgba(251,191,36,0.1);border:1px solid rgba(251,191,36,0.35);color:#fcd34d}
.tot{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;border-top:1px solid var(--line2);align-items:baseline}
.tot:first-child{border-top:0}
.storia{font-size:12.5px;color:var(--muted);padding:10px 14px;border-top:1px solid var(--line2)}
.storia:first-child{border-top:0}
.foglio{background:#ffffff;color:#1c1c1c;border-radius:12px;padding:20px 18px;font-size:13px;line-height:1.5}
.foglio .fh{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;border-bottom:2px solid #1c1c1c;padding-bottom:12px;margin-bottom:14px}
.foglio .ftit{font-family:'Syne',sans-serif;font-weight:800;font-size:20px;margin:0}
.foglio .fsub{color:#555;font-size:12px}
.foglio .fparti{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:14px}
.foglio .fparti > div{min-width:0;word-break:break-word}
.foglio .fk{font-size:11px;color:#666;font-weight:700;letter-spacing:0.2px;margin-bottom:2px}
.foglio .ftab{overflow-x:auto;margin:6px 0 12px}
.foglio table{width:100%;border-collapse:collapse;min-width:420px}
.foglio th{font-size:11px;color:#666;text-align:left;border-bottom:1px solid #ccc;padding:6px 4px}
.foglio td{padding:8px 4px;border-bottom:1px solid #e3e3e3;vertical-align:top}
.foglio .dx{text-align:right;white-space:nowrap}
.foglio .ftot{margin-left:auto;max-width:300px}
.foglio .ftot div{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.foglio .ftot .gr{font-weight:700;font-size:15px;border-top:2px solid #1c1c1c;padding-top:6px;margin-top:4px}
.foglio .fnote{margin-top:14px;font-size:12px;color:#333;border-top:1px solid #ddd;padding-top:10px}

(function(){

  var ICO_CHEV = '<span class="chev"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></span>';

  var ICO_CLIP = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11.5l-7.6 7.6a5 5 0 0 1-7.1-7.1l8.1-8.1a3.4 3.4 0 0 1 4.8 4.8l-8 8a1.7 1.7 0 0 1-2.4-2.4l7.3-7.3"></path></svg>';
  var ICO_PENNA = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg>';

  // ---------------- utilita' ----------------
  function $(id){ return document.getElementById(id); }
  function esc(s){
    if(s === null || s === undefined) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
  function euro(c){
    var n = Number(c || 0) / 100;
    return n.toLocaleString('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
  }
  function euroCorto(c){
    var n = Number(c || 0) / 100;
    if(Math.round(n) === n) return n.toLocaleString('it-IT') + ' €';
    return euro(c);
  }
  function numCsv(c){
    if(c === null || c === undefined || c === '') return '';
    return (Number(c) / 100).toFixed(2).replace('.', ',');
  }
  var FMT_GIORNO = new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Rome', year: 'numeric', month: '2-digit', day: '2-digit' });
  var FMT_ORA = new Intl.DateTimeFormat('it-IT', { timeZone: 'Europe/Rome', hour: '2-digit', minute: '2-digit' });
  function giornoRoma(d){ return FMT_GIORNO.format(d); }
  function oggi(){ return (DATI && DATI.oggi) ? String(DATI.oggi) : giornoRoma(new Date()); }
  function parteData(s){
    var m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
    return m ? { a: Number(m[1]), m: Number(m[2]), g: Number(m[3]), iso: m[0] } : null;
  }
  // giorno (AAAA-MM-GG) di un valore: date semplici restano tali, i momenti vanno in ora italiana
  function giornoDi(v){
    if(!v) return '';
    var s = String(v);
    if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
    var d = new Date(s);
    if(isNaN(d.getTime())) return s.slice(0, 10);
    return giornoRoma(d);
  }
  function diffGiorni(a, b){
    var pa = parteData(a), pb = parteData(b);
    if(!pa || !pb) return null;
    return Math.round((Date.UTC(pb.a, pb.m - 1, pb.g) - Date.UTC(pa.a, pa.m - 1, pa.g)) / 86400000);
  }
  function dataLunga(v){
    var p = parteData(giornoDi(v));
    if(!p) return 'n.d.';
    return p.g + ' ' + MESI[p.m - 1] + ' ' + p.a;
  }
  function dataBreve(v){
    var p = parteData(giornoDi(v));
    if(!p) return 'n.d.';
    var anno = Number(oggi().slice(0, 4));
    return p.g + ' ' + MESI[p.m - 1] + (p.a !== anno ? ' ' + p.a : '');
  }
  function oraDi(v){
    var d = new Date(v);
    return isNaN(d.getTime()) ? '' : FMT_ORA.format(d);
  }
  function quando(v){
    if(!v) return '';
    var g = giornoDi(v);
    var dd = diffGiorni(g, oggi());
    var ora = oraDi(v);
    if(dd === 0) return 'Oggi ' + ora;
    if(dd === 1) return 'Ieri ' + ora;
    return dataBreve(v) + (ora ? ', ' + ora : '');
  }
  function fa(v){
    var t = new Date(v).getTime();
    if(isNaN(t)) return '';
    var min = Math.round((Date.now() - t) / 60000);
    if(min < 1) return 'adesso';
    if(min < 60) return min === 1 ? '1 minuto fa' : min + ' minuti fa';
    var ore = Math.round(min / 60);
    if(ore < 24) return ore === 1 ? '1 ora fa' : ore + ' ore fa';
    var gg = Math.round(ore / 24);
    return gg === 1 ? 'ieri' : gg + ' giorni fa';
  }
  // "il 8" diventa "l'8", "fino al 11" diventa "fino all'11"
  function art(prep, txt){
    var el = /^(8|11)(\s|$)/.test(String(txt));
    var m = { il: ['il ', 'l\''], al: ['al ', 'all\''], dal: ['dal ', 'dall\''], Dal: ['Dal ', 'Dall\''] };
    return (el ? m[prep][1] : m[prep][0]) + txt;
  }
  function quandoFrase(v){
    if(!v) return '';
    var dd = diffGiorni(giornoDi(v), oggi());
    var ora = oraDi(v);
    if(dd === 0) return 'oggi alle ' + ora;
    if(dd === 1) return 'ieri alle ' + ora;
    return art('il', dataBreve(v)) + (ora ? ' alle ' + ora : '');
  }
  function giornoEvento(d){
    var dd = diffGiorni(oggi(), d);
    if(dd === 0) return 'oggi';
    if(dd === 1) return 'domani, ' + dataBreve(d);
    return art('il', dataBreve(d));
  }
  function dimensione(b){
    var n = Number(b || 0);
    if(!n) return '';
    if(n < 1024 * 1024) return Math.max(1, Math.round(n / 1024)) + ' KB';
    return (n / 1048576).toFixed(1).replace('.', ',') + ' MB';
  }
  function nomeCliente(c){
    var n = [c.nome, c.cognome].filter(function(x){ return x && String(x).trim(); }).join(' ');
    return n || c.email || 'Cliente senza nome';
  }
  function nomePiano(p){
    p = String(p || '').toLowerCase();
    return p === 'base' ? 'Base' : p === 'pro' ? 'Pro' : p === 'agenzia' ? 'Agenzia' : p === 'info' ? 'Punto Info' : 'n.d.';
  }
  function pianoPill(p){
    p = String(p || '').toLowerCase();
    var cls = p === 'base' ? 'p-base' : p === 'pro' ? 'p-pro' : p === 'agenzia' ? 'p-ag' : p === 'info' ? 'p-info' : 'p-neu';
    return '<span class="pill ' + cls + '">' + esc(nomePiano(p).toUpperCase()) + '</span>';
  }
  function abbonamento(p){ p = String(p || '').toLowerCase(); return p === 'agenzia' || p === 'info'; }
  function dashUrl(piano, token){
    var p = String(piano || '').toLowerCase();
    var f = p === 'pro' ? 'pro-dashboard.html' : p === 'agenzia' ? 'agenzia-dashboard.html' : p === 'info' ? 'info-dashboard.html' : 'base-dashboard.html';
    return f + '?token=' + encodeURIComponent(token);
  }
  function landingUrl(ev){
    if(ev.slug) return 'landing.html?slug=' + encodeURIComponent(ev.slug);
    return 'landing.html?id=' + encodeURIComponent(ev.id);
  }
  function codiceStato(c){ return (c && c.stato && c.stato.codice) ? c.stato.codice : ''; }
  var CODICI_ATTIVI = ['attivo','manuale','disdetta_programmata','pagamento_non_riuscito','annullato_senza_data','senza_evento','evento_in_arrivo','concluso'];
  var CODICI_ABB_ATTIVI = ['attivo','manuale','disdetta_programmata','pagamento_non_riuscito','annullato_senza_data'];
  function clienteAttivo(c){ return CODICI_ATTIVI.indexOf(codiceStato(c)) >= 0; }
  function abbonamentoAttivo(c){ return abbonamento(c.piano) && CODICI_ABB_ATTIVI.indexOf(codiceStato(c)) >= 0; }
  function accessoManuale(c){ return Number(c.n_pagamenti_reali || 0) === 0; }
  function rinnovoEntro7(c){
    if(!abbonamento(c.piano) || codiceStato(c) !== 'attivo' || !c.subscription_renews_at) return false;
    var t = new Date(c.subscription_renews_at).getTime();
    return t >= Date.now() && t <= Date.now() + 7 * 86400000;
  }
  // testo e colore dello stato di un cliente
  function statoInfo(c){
    var st = (c && c.stato) || {};
    switch(st.codice){
      case 'attivo': return { dot: 'd-ok', pill: 'p-ok', breve: 'Abbonamento attivo', testo: st.rinnovo ? 'Attivo, si rinnova ' + art('il', dataBreve(st.rinnovo)) : 'Abbonamento attivo' };
      case 'manuale': return { dot: 'd-ok', pill: 'p-neu', breve: 'Accesso manuale', testo: 'Accesso manuale, senza abbonamento' };
      case 'disdetta_programmata': return { dot: 'd-warn', pill: 'p-warn', breve: 'Disdetta programmata', testo: 'Disdetta programmata, attivo fino ' + art('al', dataBreve(st.fino_al)) };
      case 'pagamento_non_riuscito': return { dot: 'd-bad', pill: 'p-bad', breve: 'Pagamento non riuscito', testo: 'Pagamento non riuscito, Stripe sta riprovando' };
      case 'fine_accesso': return { dot: 'd-neu', pill: 'p-warn', breve: 'Annullato', testo: 'Annullato, accesso fino ' + art('al', dataBreve(st.fino_al)) };
      case 'scaduto': return { dot: 'd-neu', pill: 'p-neu', breve: 'Scaduto', testo: 'Scaduto ' + art('il', dataBreve(st.fino_al)) };
      case 'annullato_senza_data': return { dot: 'd-warn', pill: 'p-warn', breve: 'Annullato senza data', testo: 'Annullato, senza data di fine: da controllare' };
      case 'senza_evento': return { dot: 'd-neu', pill: 'p-neu', breve: 'Nessun evento', testo: 'Nessun evento creato' };
      case 'evento_in_arrivo': return { dot: 'd-gold', pill: 'p-ok', breve: 'Evento in arrivo', testo: 'Evento ' + giornoEvento(st.evento_data) };

      default: return { dot: 'd-neu', pill: 'p-neu', breve: 'Stato non indicato', testo: 'Stato non indicato' };
    }
  }
  function pianoConPrezzo(c, periodo){
    var p = String(c.piano || '').toLowerCase();
    if(p === 'base') return 'Base, ' + euroCorto(PREZZI.base);
    if(p === 'pro') return 'Pro, ' + euroCorto(PREZZI.pro);

      var nome = nomePiano(p);
      if(periodo === 'mensile' || periodo === 'annuale'){
        return nome + ' ' + periodo + ', ' + euroCorto(PREZZI[p + '_' + periodo]);
      }
      return codiceStato(c) === 'manuale' ? nome + ', accesso manuale' : nome;

    return nomePiano(p);

  // richieste di assistenza
  function daGestire(r){ return r.stato !== 'risolta' && r.ultimo_mittente === 'cliente'; }
  function inAttesa(r){ return r.stato !== 'risolta' && r.ultimo_mittente === 'staff'; }
  function rango(r){ return r.urgente ? 0 : (String(r.piano) === 'agenzia' ? 1 : 2); }
  function ordinaRichieste(lista, piuVecchiePrima){
    return lista.slice().sort(function(a, b){
      var d = rango(a) - rango(b);
      if(d) return d;
      var ta = new Date(a.ultimo_messaggio_at).getTime(), tb = new Date(b.ultimo_messaggio_at).getTime();
      return piuVecchiePrima ? ta - tb : tb - ta;

  function nomeRichiesta(r){ return r.cliente_nome || r.nome || r.email || 'Cliente'; }

    if(r.stato === 'risolta') return '<span class="pill p-ok">Risolta</span>';

    return '<span class="pill p-neu">In attesa del cliente</span>';

    toastTimer = setTimeout(function(){ t.className = 'toast'; }, 3500);

  function mostraLogin(messaggio){

    $('appView').hidden = true;
    $('loginView').hidden = false;

  async function accedi(){

  // ---------------- portiere ----------------
  async function chiedi(azione, extra, dove){
    var s = await sb.auth.getSession();
    var token = s && s.data && s.data.session ? s.data.session.access_token : null;
    if(!token){ var e0 = new Error('NO_SESSION'); e0.status = 401; throw e0; }
    var payload = { action: azione };
    if(extra){ for(var k in extra){ if(Object.prototype.hasOwnProperty.call(extra, k)) payload[k] = extra[k]; } }
    var r;
    try{
      r = await fetch(dove || FN_URL, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token }, body: JSON.stringify(payload) });
    }catch(errRete){
      throw new Error('Connessione assente o instabile. Riprova tra poco.');
    }
    var j = null;
    try{ j = await r.json(); }catch(e){ j = null; }
    if(!r.ok){
      var err = new Error((j && j.error) ? j.error : ('Errore ' + r.status));
      err.status = r.status;
      throw err;
    }
    return j;
  }
  // azioni nuove (notifiche e Da controllare): stesso accesso, portiere gestionale-azioni
  function chiediAz(azione, extra){ return chiedi(azione, extra, AZ_URL); }
  // gestisce sessione scaduta e accesso negato; true se l'errore e' stato gestito
  function gestisciErrore(e){
    if(e && (e.status === 401 || e.message === 'NO_SESSION')){
      sb.auth.signOut().catch(function(){});
      mostraLogin('Sessione scaduta. Accedi di nuovo.');
      return true;
    }
    if(e && e.status === 403 && /autorizzato/i.test(e.message || '')){
      sb.auth.signOut().catch(function(){});
      mostraLogin('Questo account non è autorizzato ad accedere al gestionale.');
      return true;
    }
    return false;
  }

  function venditoreNome(code){
    if(!code) return 'Nessuno';
    for(var i = 0; i < VENDITORI.length; i++){ if(VENDITORI[i].code === code) return VENDITORI[i].nome; }
    return code;

  function etichettaEvento(e){
    if(e.bozza) return '<span class="pill p-warn">Bozza</span>';
    if(e.concluso) return '<span class="pill p-neu">Concluso</span>';
    if(e.attivo === false) return '<span class="pill p-bad">Chiuso</span>';
    return '<span class="pill p-ok">Attivo</span>';
  }
  function numeriEvento(e){
    var mod = e.modalita || 'iscrizioni';
    var ric = Number(e.n_richieste || 0);
    var testoRic = ric === 1 ? '1 richiesta' : ric + ' richieste';
    if(mod === 'info') return 'solo informazioni, ' + testoRic;
    var t = (e.n_iscritti || 0) + (e.capienza ? ' iscritti su ' + e.capienza : ' iscritti');
    if(Number(e.n_attesa || 0)) t += ', ' + e.n_attesa + ' in lista d\'attesa';
    if(mod === 'entrambe') t += ', ' + testoRic;
    return t;
  }

    o.disabled = vuoto;

  // ---------------- INCASSI ----------------
  function periodo(per){
    var o = parteData(oggi());
    var due = function(n){ return String(n).padStart(2, '0'); };
    if(per === 'mese') return { dal: o.a + '-' + due(o.m) + '-01', al: oggi() };
    if(per === 'mese_scorso'){
      var a = o.m === 1 ? o.a - 1 : o.a, m = o.m === 1 ? 12 : o.m - 1;
      var ultimo = new Date(Date.UTC(a, m, 0)).getUTCDate();
      return { dal: a + '-' + due(m) + '-01', al: a + '-' + due(m) + '-' + due(ultimo) };
    }
    if(per === 'anno') return { dal: o.a + '-01-01', al: oggi() };
    return { dal: F.incDal || (o.a + '-' + due(o.m) + '-01'), al: F.incAl || oggi() };
  }

    var p = periodo(F.incPer);

    $('inc_sconto').addEventListener('change', function(){ F.incSconto = this.checked; INC = null; caricaIncassi(); });
    caricaIncassi();
  }
  function chiaveIncassi(){ return [F.incDal, F.incAl, F.incPiano, F.incSconto].join('|'); }
  async function caricaIncassi(){
    var corpo = $('inc_corpo');
    if(!F.incDal || !F.incAl){ corpo.innerHTML = '<div class="sec"><div class="msgx err">Scegli le due date.</div></div>'; return; }
    if(F.incDal > F.incAl){ corpo.innerHTML = '<div class="sec"><div class="msgx err">La data "Dal" è dopo la data "Al".</div></div>'; return; }
    var chiave = chiaveIncassi();
    if(INC && INC.chiave === chiave){ disegnaIncassi(); return; }
    corpo.innerHTML = '<div class="caricamento">Caricamento degli incassi...</div>';
    try{
      var res = await chiedi('incassi', { dal: F.incDal, al: F.incAl, piano: F.incPiano, solo_sconto: F.incSconto });
      if(chiave !== chiaveIncassi() || rotta().v !== 'incassi') return;
      INC = { chiave: chiave, d: res.dati || {}, fatt: null };
      try{
        var idsF = ((INC.d.righe) || []).map(function(p){ return p.id; }).filter(Boolean).slice(0, 1000);
        if(idsF.length){ var rf = await chiediF('fatture_pagamenti', { payment_ids: idsF }); INC.fatt = rf.fatture || {}; } else INC.fatt = {};
      }catch(eF){
        if(gestisciErrore(eF)) return;
        INC.fatt = null;
      }
      if(chiave !== chiaveIncassi() || rotta().v !== 'incassi') return;
      disegnaIncassi();
    }catch(e){
      if(!gestisciErrore(e)) corpo.innerHTML = '<div class="sec"><div class="msgx err">Incassi non disponibili: ' + esc(e.message) + '</div></div>';
    }

    h += '</div></details>';
    return h;

  async function cambiaCategoria(id, cat){

    if(!window.confirm(domanda)) return;

  function scaricaCsv(){
    if(!INC || !INC.d) return;
    var righe = INC.d.righe || [];
    var cella = function(v){
      var s = (v === null || v === undefined) ? '' : String(v);
      return /[";\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    var out = [['Data','Cliente','Email','Pacchetto','Periodo','Tipo','Listino','Sconto','Codice sconto','Pagato','Commissioni Stripe','Arrivato a te','Categoria','Riferimento Stripe'].join(';')];
    righe.slice().reverse().forEach(function(p){
      var netto = (p.commissioni === null || p.commissioni === undefined) ? '' : numCsv(Number(p.importo) - Number(p.commissioni));
      out.push([
        dataLunga(p.pagato_il), p.cliente_nome || '', p.cliente_email || '', nomePiano(p.piano), p.periodo || '',
        tipoPagamento(p), p.tipo === 'rimborso' ? '' : numCsv(p.listino), numCsv(p.sconto || 0), p.codice_sconto || '',
        numCsv(p.importo), numCsv(p.commissioni), netto,
        p.categoria === 'reale' ? 'Incasso reale' : p.categoria === 'prova' ? 'Prova' : 'Omaggio', p.stripe_id || ''
      ].map(cella).join(';'));
    });
    var blob = new Blob(['\ufeff' + out.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'incassi-eventsfun_' + F.incDal + '_' + F.incAl + '.csv';
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 1500);
  }

  async function inviaRisposta(){

    nascondiMsg(msg);
    var testo = $('rp_txt').value.trim();
    if(!testo){ mostraMsg(msg, 'Scrivi la risposta.', 'err'); return; }
    btn.disabled = true; btn.textContent = 'Invio in corso...';
    try{
      var id = RICH.richiesta.id;
      var res = await chiedi('assistenza_rispondi', { richiesta_id: id, testo: testo, risolvi: $('rp_risolvi').checked });
      RICH = res.dati || null;
      toast('Risposta inviata');
      await aggiornaDati(false);
      if(rotta().v === 'richiesta') vistaRichiesta(id);
    }catch(e){
      btn.disabled = false; btn.textContent = 'Invia risposta';
      if(!gestisciErrore(e)) mostraMsg(msg, e.message, 'err');
    }
  }
  async function cambiaStatoRichiesta(stato){
    if(!RICH || !RICH.richiesta || RICH.richiesta.stato === stato) return;
    try{
      var id = RICH.richiesta.id;
      await chiedi('assistenza_stato', { richiesta_id: id, stato: stato });
      RICH.richiesta.stato = stato;
      toast('Stato aggiornato');
      await aggiornaDati(false);
      RICH = null;
      if(rotta().v === 'richiesta') vistaRichiesta(id);
    }catch(e){
      if(!gestisciErrore(e)) toast(e.message, true);
    }
  }

  function listaEventi(){

    var lista = ev.filter(function(e){ return F.ev === 'tutti' || cat(e) === F.ev; }).filter(function(e){

  // ---------------- NOTIFICHE SU QUESTO DISPOSITIVO ----------------
  // Le notifiche arrivano dal service worker del gestionale (gestionale-sw.js, ambito limitato al gestionale).
  var PUSH = { regProm: null, sub: null, stato: null, errore: '', occupato: false, caricato: false };
  function eIOS(){
    var ua = navigator.userAgent || '';
    return /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  }
  function eInstallata(){
    try{ return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true; }catch(e){ return false; }
  }
  function pushPossibile(){
    return !!(window.isSecureContext && ('serviceWorker' in navigator) && ('PushManager' in window) && ('Notification' in window));
  }
  function registraSW(){
    if(!('serviceWorker' in navigator) || !window.isSecureContext) return null;
    if(!PUSH.regProm){
      PUSH.regProm = navigator.serviceWorker.register('gestionale-sw.js', { scope: 'gestionale' })
        .catch(function(e){ PUSH.regProm = null; throw e; });
    }
    return PUSH.regProm;
  }
  function chiaveInByte(b64){
    var s = String(b64 || '').replace(/-/g, '+').replace(/_/g, '/');
    s += '==='.slice((s.length + 3) % 4);
    var bin = atob(s), out = new Uint8Array(bin.length);
    for(var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  // l'iscrizione del browser e' fatta con la chiave attuale del server?
  function stessaChiave(sub, pub){
    try{
      var a = sub && sub.options && sub.options.applicationServerKey;
      if(!a) return true;
      var x = new Uint8Array(a), y = chiaveInByte(pub);
      if(x.length !== y.length) return false;
      for(var i = 0; i < x.length; i++){ if(x[i] !== y[i]) return false; }
      return true;
    }catch(e){ return true; }
  }
  function nomeDispositivo(){
    var ua = navigator.userAgent || '';
    var so = /Android/i.test(ua) ? 'Android'
      : eIOS() ? (/iPhone|iPod/.test(ua) ? 'iPhone' : 'iPad')
      : /Windows/i.test(ua) ? 'Windows'
      : /CrOS/.test(ua) ? 'Chromebook'
      : /Mac OS X|Macintosh/i.test(ua) ? 'Mac'
      : /Linux/i.test(ua) ? 'Linux' : 'Dispositivo';
    var br = /SamsungBrowser/i.test(ua) ? 'Samsung Internet'
      : /Edg\//.test(ua) ? 'Edge'
      : /OPR\//.test(ua) ? 'Opera'
      : /Firefox\//.test(ua) ? 'Firefox'
      : /Chrome\//.test(ua) ? 'Chrome'
      : /Safari\//.test(ua) ? 'Safari' : '';
    return (so + (br ? ', ' + br : '') + (eInstallata() ? ', app' : '')).slice(0, 120);
  }
  function riquadroNotifiche(){
    if(ME.ruolo !== 'admin') return '';
    return '<div class="sec"><div class="h2">Notifiche su questo dispositivo</div><div class="card" id="pushBox"><div class="vuoto">Controllo delle notifiche...</div></div></div>';
  }
  function apriRiquadroPush(){
    if(!$('pushBox')) return;
    PUSH.caricato = false;
    disegnaPush();
    caricaPush().then(disegnaPush);
  }
  async function caricaPush(){
    PUSH.errore = '';
    try{
      PUSH.sub = null;
      if(pushPossibile()){
        var reg = await registraSW();
        PUSH.sub = reg ? await reg.pushManager.getSubscription() : null;
      }
      var r = await chiediAz('push_stato', { endpoint: PUSH.sub ? PUSH.sub.endpoint : '' });
      PUSH.stato = r.stato || { questo: false, dispositivi: [] };
    }catch(e){
      if(!gestisciErrore(e)) PUSH.errore = 'Stato delle notifiche non disponibile: ' + (e.message || e);
    }
    PUSH.caricato = true;
  }
  function disegnaPush(){
    var box = $('pushBox');
    if(!box) return;
    var st = PUSH.stato;
    var perm = ('Notification' in window) ? Notification.permission : 'default';
    var dis = PUSH.occupato ? ' disabled' : '';
    var h = '<div class="blk">';
    if(!PUSH.caricato){
      h += '<div class="note">Controllo delle notifiche...</div>';
    }else if(!pushPossibile()){
      if(eIOS() && !eInstallata()) h += '<div class="note">Su iPhone e iPad le notifiche arrivano solo se il gestionale è aggiunto alla schermata Home. In Safari tocca Condividi, poi Aggiungi alla schermata Home, e apri il gestionale dall\'icona. Serve iOS 16.4 o successivo.</div>';
      else h += '<div class="note">Questo browser non può ricevere notifiche.</div>';
    }else if(st && st.questo && PUSH.sub && perm === 'granted'){
      h += '<div class="note">Le notifiche sono attive su questo dispositivo.</div>';
      h += '<div class="bottoni"><button class="btn sec2" type="button" data-az="push_prova"' + dis + '>Manda una notifica di prova</button><button class="btn sec2" type="button" data-az="push_disattiva"' + dis + '>Disattiva</button></div>';
    }else if(perm === 'denied'){
      h += '<div class="note">Le notifiche per questo sito sono bloccate nelle impostazioni del browser: riattivale da lì e poi riprova.</div>';
    }else{
      h += '<div class="note">Ricevi un avviso su questo dispositivo quando arriva un nuovo cliente, una richiesta o una risposta all\'assistenza, oppure un messaggio dal sito.</div>';
      h += '<button class="btn pieno" type="button" data-az="push_attiva"' + dis + '>' + (PUSH.occupato ? 'Attivazione in corso...' : 'Attiva le notifiche') + '</button>';
    }
    if(PUSH.errore) h += '<div class="msgx err">' + esc(PUSH.errore) + '</div>';
    h += '</div>';
    var disp = (st && st.dispositivi) || [];
    if(disp.length){
      h += '<div class="row" style="border-top:1px solid var(--line2)"><div class="grow note">I tuoi dispositivi</div></div>';
      disp.forEach(function(d){
        var pills = '';
        if(d.questo) pills += '<span class="pill p-gold">Questo dispositivo</span>';
        if(Number(d.errori_consecutivi || 0) >= 3) pills += '<span class="pill p-warn">Non raggiungibile</span>';
        h += '<div class="row"><div class="grow"><div class="t">' + esc(d.dispositivo || 'Dispositivo') + '</div><div class="s">Attivato ' + esc(art('il', dataBreve(d.created_at))) + '</div>' + (pills ? '<div class="pills" style="margin-top:6px">' + pills + '</div>' : '') + '</div>';
        h += '<button class="btn sec2 piccolo" type="button" data-az="push_rimuovi" data-id="' + esc(d.id) + '"' + dis + '>Rimuovi</button></div>';
      });
    }
    box.innerHTML = h;
  }
  async function iscriviSulServer(sub){
    var j = sub.toJSON ? sub.toJSON() : {};
    var k = j.keys || {};
    var r = await chiediAz('push_iscrivi', { endpoint: sub.endpoint, p256dh: k.p256dh || '', auth: k.auth || '', dispositivo: nomeDispositivo() });
    PUSH.stato = r.stato || PUSH.stato;
  }
  async function attivaPush(){
    if(PUSH.occupato || !pushPossibile()) return;
    PUSH.occupato = true; PUSH.errore = ''; disegnaPush();
    try{
      var perm = Notification.permission;
      if(perm !== 'granted') perm = await Notification.requestPermission();
      if(perm === 'granted'){
        var reg = await registraSW();
        if(!reg) throw new Error('servizio delle notifiche non disponibile');
        var chiave = (await chiediAz('push_chiave')).pub;
        var sub = await reg.pushManager.getSubscription();
        if(sub && !stessaChiave(sub, chiave)){ try{ await sub.unsubscribe(); }catch(e1){} sub = null; }
        if(!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: chiaveInByte(chiave) });
        PUSH.sub = sub;
        await iscriviSulServer(sub);
        toast('Notifiche attivate');
      }
    }catch(e){
      if(!gestisciErrore(e)) PUSH.errore = 'Attivazione non riuscita: ' + (e.message || e);
    }
    PUSH.occupato = false; disegnaPush();
  }
  async function disattivaPush(){
    if(PUSH.occupato) return;
    PUSH.occupato = true; PUSH.errore = ''; disegnaPush();
    try{
      if(PUSH.sub){
        var r = await chiediAz('push_rimuovi', { endpoint: PUSH.sub.endpoint });
        PUSH.stato = r.stato || PUSH.stato;
        try{ await PUSH.sub.unsubscribe(); }catch(e1){}
        PUSH.sub = null;
      }
      toast('Notifiche disattivate');
    }catch(e){
      if(!gestisciErrore(e)) PUSH.errore = 'Disattivazione non riuscita: ' + (e.message || e);
    }
    PUSH.occupato = false; disegnaPush();
  }
  async function provaPush(){
    if(PUSH.occupato || !PUSH.sub) return;
    PUSH.occupato = true; PUSH.errore = ''; disegnaPush();
    var errore = '';
    try{
      await chiediAz('push_prova', { endpoint: PUSH.sub.endpoint });
      toast('Notifica di prova inviata: arriva tra pochi secondi');
    }catch(e){
      if(!gestisciErrore(e)){
        errore = e.message || String(e);
        if(e.status === 404 || e.status === 502) await caricaPush();
      }
    }
    PUSH.errore = errore;
    PUSH.occupato = false; disegnaPush();
  }
  async function rimuoviDispositivo(id){
    if(PUSH.occupato) return;

  // controlli dei numeri fiscali (gli stessi del database)
  function controllo11(s){
    if(!/^\d{11}$/.test(s)) return false;
    var t = 0;
    for(var i = 0; i < 10; i++){ var d = +s[i]; if(i % 2){ d *= 2; if(d > 9) d -= 9; } t += d; }
    return (10 - t % 10) % 10 === +s[10];
  }
  var CF_DISPARI = { '0':1,'1':0,'2':5,'3':7,'4':9,'5':13,'6':15,'7':17,'8':19,'9':21,'A':1,'B':0,'C':5,'D':7,'E':9,'F':13,'G':15,'H':17,'I':19,'J':21,'K':2,'L':4,'M':18,'N':20,'O':11,'P':3,'Q':6,'R':8,'S':12,'T':14,'U':16,'V':10,'W':22,'X':25,'Y':24,'Z':23 };
  function controllo16(s){
    if(!/^[A-Z]{6}[0-9LMNPQRSTUV]{2}[A-Z][0-9LMNPQRSTUV]{2}[A-Z][0-9LMNPQRSTUV]{3}[A-Z]$/.test(s)) return false;
    var t = 0;
    for(var i = 0; i < 15; i++){ var ch = s[i]; t += (i % 2 === 0) ? CF_DISPARI[ch] : (/\d/.test(ch) ? +ch : ch.charCodeAt(0) - 65); }
    return String.fromCharCode(65 + t % 26) === s[15];
  }
  // elenco di [campo, messaggio]; stesse regole del database (che resta comunque l'ultimo controllo)
  function controllaClienteF(c){
    var e = [];
    var naz = String(c.nazione || 'IT').toUpperCase();
    if(c.tipo === 'persona'){
      if(!String(c.nome || '').trim()) e.push(['nome', 'Scrivi il nome.']);
      if(!String(c.cognome || '').trim()) e.push(['cognome', 'Scrivi il cognome.']);
    } else if(!String(c.denominazione || '').trim()) e.push(['denominazione', 'Scrivi la ragione sociale o il nome dell\'ente.']);
    if(String(c.denominazione || '').trim().length > 80) e.push(['denominazione', 'Al massimo 80 caratteri.']);
    var idf = String(c.id_fiscale || '').toUpperCase().replace(/\s/g, '');
    if(naz === 'IT'){
      if(!idf) e.push(['id_fiscale', 'Scrivi la partita IVA o il codice fiscale.']);
      else if(/^\d{11}$/.test(idf)){
        if(c.tipo_id !== 'piva' && c.tipo_id !== 'cf') e.push(['id_fiscale', 'Il numero ha 11 cifre: scegli qui sotto se è una partita IVA o un codice fiscale.']);
        else if(!controllo11(idf)) e.push(['id_fiscale', 'Il numero non è valido: controlla di averlo copiato bene.']);
      } else if(idf.length === 16){
        if(!controllo16(idf)) e.push(['id_fiscale', 'Il codice fiscale non è valido: controlla di averlo copiato bene.']);
      } else e.push(['id_fiscale', 'Serve una partita IVA (11 cifre) o un codice fiscale (16 caratteri o 11 cifre).']);
      if(!/^\d{5}$/.test(String(c.cap || ''))) e.push(['cap', 'Il CAP ha 5 cifre.']);
      if(!/^[A-Za-z]{2}$/.test(String(c.provincia || ''))) e.push(['provincia', 'La provincia sono 2 lettere.']);
    } else if(!idf) e.push(['id_fiscale', 'Serve l\'identificativo fiscale del cliente.']);
    if(!String(c.indirizzo || '').trim() || String(c.indirizzo).trim().length > 60) e.push(['indirizzo', 'Indirizzo obbligatorio, al massimo 60 caratteri.']);
    if(!String(c.comune || '').trim() || String(c.comune).trim().length > 60) e.push(['comune', 'Comune obbligatorio, al massimo 60 caratteri.']);
    if(c.codice_destinatario && !/^[A-Za-z0-9]{7}$/.test(c.codice_destinatario)) e.push(['codice_destinatario', 'Il codice destinatario ha 7 caratteri tra lettere e numeri.']);
    if(c.pec && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c.pec)) e.push(['pec', 'La PEC non sembra un indirizzo email.']);
    return e;
  }

      h += '<div class="sec"><div class="bottoni">' + (f.stato === 'da_caricare' ? '<button class="btn sec2" type="button" data-az="f_correggi_annulla">Annulla</button>' : '') + '<button class="btn' + (f.stato === 'da_caricare' ? '' : ' pieno') + '" type="button" data-az="f_correggi" id="f_corr_btn">Salva e prepara di nuovo il file</button></div><div class="msgx" id="f_msg2"></div>';
      h += '<div class="note" style="margin-top:8px">Il numero e la data restano gli stessi; il file avrà un nome nuovo, come chiede lo SdI.</div></div>';
    }
    h += '<div class="sec"><div class="h2">Riepilogo</div><div class="card"><div class="kv">';
    h += '<div><div class="k">Numero</div><div class="v">' + esc(numFattura(f)) + '</div></div>';
    h += '<div><div class="k">Data</div><div class="v">' + esc(dataNum(f.data_fattura)) + '</div></div>';
    h += '<div><div class="k">Cliente</div><div class="v">' + esc(nomeFatt(f.cliente)) + '</div></div>';
    h += '<div><div class="k">' + (f.cliente && f.cliente.tipo_id === 'cf' ? 'Codice fiscale' : 'Partita IVA') + '</div><div class="v">' + esc((f.cliente || {}).id_fiscale || '') + '</div></div>';
    h += '<div><div class="k">Recapito per lo SdI</div><div class="v">' + esc(recapitoF(f.cliente)) + '</div></div>';
    h += '<div><div class="k">Pacchetto</div><div class="v">' + esc(nomePiano(f.piano) + (f.periodo ? ' ' + f.periodo : '')) + '</div></div>';
    h += '<div><div class="k">Rif. Stripe</div><div class="v">' + esc(f.numero_stripe || 'nessuno') + '</div></div>';
    h += '<div><div class="k">Importo</div><div class="v">' + esc(euro(f.importo)) + '</div></div>';
    h += '</div><div class="tot"><span class="s" style="margin:0">Nome del file per lo SdI</span><span class="tok" style="text-align:right">' + esc(nomeFileF(f)) + '</span></div></div>';
    h += '<div style="margin-top:8px"><a class="btn sec2 pieno" href="' + esc(f.order_id ? '#cliente/' + f.order_id : '#fatture') + '">Scheda cliente</a></div></div>';
    h += '<div class="sec"><div class="h2">Importi</div>' + importiF(f.importo) + '</div>';
    h += '<div class="sec"><div class="h2">Cronologia</div><div class="card">';
    (f.storia || []).forEach(function(s){ h += '<div class="storia">' + esc(quando(s.quando)) + ': ' + esc(s.evento) + (s.autore ? ' (' + esc(s.autore) + ')' : '') + '</div>'; });
    h += '</div></div></div>';
    metti(h);
    if(scrive && (f.stato === 'scartata' || (f.stato === 'da_caricare' && UIF.correggi))) collegaModuloF();
  }
  function scaricaTesto(nome, testo, tipo){
    var blob = new Blob([testo], { type: tipo });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = nome;
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 1500);
  }
  async function scaricaXmlF(){
    var f = FDET; if(!f) return;
    var btn = $('f_xml_btn'), testo = btn ? btn.textContent : '';
    if(btn){ btn.disabled = true; btn.textContent = 'Preparazione del file...'; }
    try{
      var res = await chiediF('fattura_xml', { fattura_id: f.id });
      scaricaTesto(res.nome_file, res.xml, 'application/xml');
      toast('File ' + res.nome_file + ' scaricato');
    }catch(e){
      if(!gestisciErrore(e)) toast('File non preparato: ' + e.message, true);
    }
    if(btn){ btn.disabled = false; btn.textContent = testo; }
  }
  async function statoFatturaF(stato){
    var f = FDET; if(!f) return;
    var motivo = '';
    if(stato === 'caricata' && !window.confirm('Hai caricato la fattura ' + numFattura(f) + ' sul portale?')) return;
    if(stato === 'scartata') motivo = $('s_motivo') ? $('s_motivo').value.trim() : '';
    try{
      var res = await chiediF('fattura_stato', { fattura_id: f.id, stato: stato, motivo: motivo });
      FDET = res.fattura; UIF.scarto = false;
      toast('Fattura ' + numFattura(FDET) + (stato === 'caricata' ? ' segnata come caricata' : ' segnata come scartata'));
      dopoModificaF();
      vistaFattura(FDET.id);
    }catch(e){
      if(!gestisciErrore(e)) mostraMsg($('f_msg'), e.message, 'err');
    }
  }
  async function correggiFatturaF(){
    var f = FDET; if(!f) return;
    var c = leggiModuloF();
    var err = controllaClienteF(c);
    mostraErroriF(err);
    if(err.length){ toast('Controlla i campi segnati in rosso.', true); return; }
    var btn = $('f_corr_btn'); btn.disabled = true; btn.textContent = 'Salvataggio...';
    try{
      var res = await chiediF('fattura_correggi', { fattura_id: f.id, cliente: c, descrizione: $('f_descr').value.trim() });
      FDET = res.fattura; UIF.correggi = false;
      toast('Dati salvati: scarica il file nuovo della fattura ' + numFattura(FDET));
      dopoModificaF();
      vistaFattura(FDET.id);
    }catch(e){
      btn.disabled = false; btn.textContent = 'Salva e prepara di nuovo il file';
      if(!gestisciErrore(e)) mostraMsg($('f_msg2'), e.message, 'err');
    }
  }

  // ---- anteprima leggibile ----
  async function vistaAnteprimaF(id){
    if(!(FDET && FDET.id === id)){
      metti('<a class="back" href="#fatture">' + ICO_BACK + 'Fatture</a><div class="caricamento">Caricamento della fattura...</div>');
      try{
        var res = await chiediF('fattura_dettaglio', { fattura_id: id });
        if(rotta().v !== 'anteprima' || rotta().id !== id) return;
        FDET = res.fattura;
        if(!FATT) await caricaFatture();
      }catch(e){
        if(!gestisciErrore(e)) metti('<a class="back" href="#fatture">' + ICO_BACK + 'Fatture</a><div class="sec"><div class="msgx err">Fattura non disponibile: ' + esc(e.message) + '</div></div>');
        return;
      }
      if(rotta().v !== 'anteprima' || rotta().id !== id) return;
    }
    var f = FDET, c = f.cliente || {}, t = TITOLARE || {}, b = Number(f.importo) > SOGLIA_BOLLO;
    var h = '<a class="back" href="#fattura/' + esc(f.id) + '">' + ICO_BACK + 'Fattura ' + esc(numFattura(f)) + '</a><div class="stretta">';
    h += '<div class="sec" style="padding-top:0"><div class="note">Anteprima leggibile. Il documento valido è il file XML caricato sul portale.</div></div>';
    h += '<div class="sec"><div class="foglio">';
    h += '<div class="fh"><div><p class="ftit">Fattura ' + esc(numFattura(f)) + '</p><div class="fsub">Fattura elettronica, tipo documento TD01</div></div><div><div class="fk">Data</div><div>' + esc(dataNum(f.data_fattura)) + '</div></div></div>';
    h += '<div style="margin:-4px 0 14px"><div class="fk">Causale</div><div>' + esc(DICITURA_F) + (f.numero_stripe ? '<br>Rif. pagamento Stripe n. ' + esc(f.numero_stripe) : '') + '</div></div>';
    h += '<div class="fparti"><div><div class="fk">Da</div><b>' + esc([t.nome, t.cognome].filter(Boolean).join(' ')) + '</b><br>' + esc([t.indirizzo, t.numero_civico].filter(Boolean).join(' ')) + '<br>' + esc((t.cap || '') + ' ' + (t.comune || '') + (t.provincia ? ' (' + t.provincia + ')' : '')) + '<br>Partita IVA ' + esc(t.partita_iva || '') + (t.codice_fiscale ? '<br>Codice fiscale ' + esc(t.codice_fiscale) : '') + '<br>Regime forfettario</div>';
    h += '<div><div class="fk">A</div><b>' + esc(nomeFatt(c)) + '</b><br>' + esc(c.indirizzo || '') + '<br>' + esc((c.cap || '') + ' ' + (c.comune || '') + (c.provincia ? ' (' + c.provincia + ')' : '')) + '<br>' + (c.tipo_id === 'cf' ? 'Codice fiscale ' : 'Partita IVA ') + esc(c.id_fiscale || '') + '<br>' + esc(c.codice_destinatario ? 'Codice destinatario ' + c.codice_destinatario : c.pec ? 'PEC ' + c.pec : 'Codice destinatario 0000000') + '</div></div>';
    h += '<div class="ftab"><table><thead><tr><th>Descrizione</th><th class="dx">Quantità</th><th class="dx">Prezzo</th><th class="dx">IVA</th><th class="dx">Totale</th></tr></thead><tbody>';
    h += '<tr><td class="descr" data-l="Descrizione">' + esc(f.descrizione) + '</td><td class="dx" data-l="Quantità">1</td><td class="dx" data-l="Prezzo">' + esc(euro(f.importo)) + '</td><td class="dx" data-l="IVA">0% (N2.2)</td><td class="dx" data-l="Totale">' + esc(euro(f.importo)) + '</td></tr>';
    h += '</tbody></table></div>';
    h += '<div class="ftot"><div><span>Imponibile</span><span>' + esc(euro(f.importo)) + '</span></div><div><span>IVA</span><span>' + esc(euro(0)) + '</span></div>';
    if(b) h += '<div><span>Bollo virtuale (a carico dell\'emittente)</span><span>2,00 €</span></div>';
    h += '<div class="gr"><span>Totale</span><span>' + esc(euro(f.importo)) + '</span></div></div>';
    h += '<div class="fnote">Riferimento normativo: ' + esc(RIF_NORM_F) + '.' + (b ? '<br>Imposta di bollo assolta in modo virtuale.' : '') + '</div>';
    h += '</div></div>';
    h += '<div class="sec"><a class="btn sec2 pieno" href="#fattura/' + esc(f.id) + '">Torna alla fattura</a></div>';
    h += '</div>';
    metti(h);
  }

  // ---- impostazioni ----
  async function vistaImpostazioniF(){
    if(!FATT){
      metti('<a class="back" href="#fatture">' + ICO_BACK + 'Fatture</a><div class="caricamento">Caricamento delle impostazioni...</div>');
      try{ await caricaFatture(); }catch(e){ return; }
      if(rotta().v !== 'fatture-impostazioni') return;
      if(!FATT){ metti('<a class="back" href="#fatture">' + ICO_BACK + 'Fatture</a><div class="sec"><div class="msgx err">Impostazioni non disponibili in questo momento.</div><div style="margin-top:12px"><button class="btn sec2" type="button" data-az="f_riprova">Riprova</button></div></div>'); return; }
    }
    var d = FATT.dati || {}, t = TITOLARE || FATT.titolare || {};
    var a = annoCorrente();
    var s1 = d.serie, s2 = d.serie_prossimo_anno;
    var bloccata = !!(s1 && Number(s1.ultimo_numero) > 0);
    var bloccata2 = !!(s2 && Number(s2.ultimo_numero) > 0);
    var scrive = puoScrivere();
    var h = '<a class="back" href="#fatture">' + ICO_BACK + 'Fatture</a><div class="stretta">';
    h += '<div class="sec" style="padding-top:0"><h1 class="h1">Impostazioni delle fatture</h1></div>';
    h += '<div class="sec"><div class="h2">Serie EventsFun</div><div class="card pad">';
    h += '<div class="campo"><label class="lbl" for="pref1">Lettere della serie ' + a + '</label><input class="field" id="pref1" value="' + esc(s1 ? s1.lettere : '') + '"' + (bloccata || !scrive ? ' disabled' : '') + ' maxlength="6" autocapitalize="characters" placeholder="Per esempio EF">';
    h += '<div class="err-campo" id="e_pref1" hidden></div><div class="note" style="margin-top:6px">' + (bloccata ? 'Bloccate: nel ' + a + ' sono già state create fatture con queste lettere.' : 'Si possono cambiare finché nel ' + a + ' non è stata creata nessuna fattura. I numeri avranno la forma ' + esc((s1 ? s1.lettere : 'EF') + '-0001') + '.') + '</div></div>';
    h += '<div class="campo"><label class="lbl" for="pref2">Lettere della serie ' + (a + 1) + '</label><input class="field" id="pref2" value="' + esc(s2 ? s2.lettere : '') + '"' + (bloccata2 || !scrive ? ' disabled' : '') + ' maxlength="6" autocapitalize="characters" placeholder="Da scegliere entro il 1° gennaio">';
    h += '<div class="err-campo" id="e_pref2" hidden></div><div class="note" style="margin-top:6px">Dal 1° gennaio la numerazione riparte da 1. Le lettere devono essere diverse da quelle delle fatture delle tue altre attività.</div></div>';
    if(scrive) h += '<button class="btn pieno" type="button" data-az="f_serie_salva" id="f_serie_btn">Salva le lettere</button><div class="msgx" id="f_msg"></div>';
    h += '</div></div>';
    h += '<div class="sec"><div class="h2">Dati fissi della fattura</div><div class="card">';
    h += '<div class="row top-al"><div class="grow"><div class="t">Titolare</div><div class="s">' + esc([t.nome, t.cognome].filter(Boolean).join(' ') + ', ' + [t.indirizzo, t.numero_civico].filter(Boolean).join(' ') + ', ' + (t.cap || '') + ' ' + (t.comune || '') + ' (' + (t.provincia || '') + ')') + '<br>Partita IVA ' + esc(t.partita_iva || '') + '<br>Codice fiscale ' + (t.codice_fiscale ? esc(t.codice_fiscale) : '<span style="color:var(--bad)">mancante: senza, il file per lo SdI non si prepara</span>') + '<br>Regime forfettario (' + esc(t.regime_fiscale || 'RF19') + ')</div></div></div>';
    h += '<div class="row top-al"><div class="grow"><div class="t">Dicitura (nella causale)</div><div class="s">' + esc(DICITURA_F) + '</div></div></div>';
    h += '<div class="row top-al"><div class="grow"><div class="t">Riferimento normativo</div><div class="s">' + esc(RIF_NORM_F) + ' (il campo del tracciato ammette al massimo 100 caratteri)</div></div></div>';
    h += '<div class="row top-al"><div class="grow"><div class="t">Bollo virtuale</div><div class="s">2,00 € sulle fatture sopra 77,47 €, a tuo carico</div></div></div>';
    h += '</div><div class="note" style="margin-top:6px">Questi dati non si modificano dal gestionale: se cambiano, si aggiornano una volta per tutte nel sistema.</div></div>';
    h += '</div>';
    metti(h);
  }
  async function salvaSerieF(){
    var a = annoCorrente(), msg = $('f_msg'), btn = $('f_serie_btn');
    nascondiMsg(msg);
    var cambi = [];
    [['pref1', a, (FATT.dati.serie || {}).lettere], ['pref2', a + 1, (FATT.dati.serie_prossimo_anno || {}).lettere]].forEach(function(x){
      var el = $(x[0]), e = $('e_' + x[0]);
      e.hidden = true; el.classList.remove('sbagliato');
      if(el.disabled) return;
      var v = el.value.trim().toUpperCase();
      if(!v || v === (x[2] || '')) return;
      if(!/^[A-Z]{1,6}$/.test(v)){ e.hidden = false; e.textContent = 'Solo lettere, da 1 a 6.'; el.classList.add('sbagliato'); cambi = null; return; }
      if(cambi) cambi.push([x[1], v]);
    });
    if(cambi === null) return;
    if(!cambi.length){ toast('Nessuna modifica da salvare'); return; }
    btn.disabled = true; btn.textContent = 'Salvataggio...';
    try{
      for(var i = 0; i < cambi.length; i++) await chiediF('fatture_serie_salva', { anno: cambi[i][0], lettere: cambi[i][1] });
      toast('Lettere salvate');
      FATT = null; FATT_ALTRO = null;
      await caricaFatture();
      vistaImpostazioniF();
    }catch(e){
      btn.disabled = false; btn.textContent = 'Salva le lettere';
      if(!gestisciErrore(e)) mostraMsg(msg, e.message, 'err');
    }
  }

  // ---- scheda cliente: dati di fatturazione ----
  async function salvaSchedaF(){
    var c = leggiModuloF();
    var err = controllaClienteF(c);
    mostraErroriF(err);
    if(err.length){ toast('Controlla i campi segnati in rosso.', true); return; }
    var btn = $('f_scheda_btn'); btn.disabled = true; btn.textContent = 'Salvataggio...';
    try{
      var id = SCHEDA.cliente.id;
      await chiediF('fatturazione_salva', { order_id: id, cliente: c });
      F.modificaFatt = false;
      SCHEDA_F = null;
      toast('Dati di fatturazione salvati');
      dopoModificaF();
      await vistaCliente(id);
    }catch(e){
      btn.disabled = false; btn.textContent = 'Salva i dati';
      if(!gestisciErrore(e)) mostraMsg($('f_msg'), e.message, 'err');
    }
  }

  // ---------------- comandi ----------------
  document.addEventListener('click', function(ev){
    var el = ev.target.closest('[data-az],[data-fcli],[data-per],[data-piano],[data-ass],[data-fev],[data-fmsg]');
    if(!el || !$('vista').contains(el)) return;
    if(el.hasAttribute('data-fcli')){ F.cli = el.getAttribute('data-fcli'); listaClienti(rotta().id); return; }
    if(el.hasAttribute('data-per')){ F.incPer = el.getAttribute('data-per'); INC = null; vistaIncassi(); return; }
    if(el.hasAttribute('data-piano')){ F.incPiano = el.getAttribute('data-piano'); INC = null; vistaIncassi(); return; }
    if(el.hasAttribute('data-ass')){ F.ass = el.getAttribute('data-ass'); vistaAssistenza(); return; }
    if(el.hasAttribute('data-fev')){ F.ev = el.getAttribute('data-fev'); listaEventi(); return; }
    if(el.hasAttribute('data-fmsg')){ F.msg = el.getAttribute('data-fmsg'); vistaMessaggi(); return; }
    var az = el.getAttribute('data-az');
    switch(az){
      case 'riprova': avvia(); break;
      case 'esci': esci(); break;
      case 'scrivi': $('scrivi_box').hidden = false; $('nv_txt').focus(); break;
      case 'scrivi_annulla': $('scrivi_box').hidden = true; break;
      case 'scrivi_invia': inviaNuovaConversazione(); break;
      case 'attr_salva': salvaAttribuzione(); break;
      case 'nota_salva': salvaNota(); break;
      case 'nota_elimina': eliminaNota(el.getAttribute('data-id')); break;
      case 'cat': ev.preventDefault(); cambiaCategoria(el.getAttribute('data-id'), el.getAttribute('data-cat')); break;
      case 'csv': scaricaCsv(); break;
      case 'rispondi': inviaRisposta(); break;
      case 'stato': cambiaStatoRichiesta(el.getAttribute('data-stato')); break;
      case 'nota_int': salvaNotaInterna(); break;
      case 'allegato': apriAllegato(el.getAttribute('data-mid'), el.getAttribute('data-aid')); break;
      case 'msg_gestito': segnaMessaggio(el.getAttribute('data-id'), el.getAttribute('data-val') === '1'); break;
      case 'vend_aggiungi': aggiungiVenditore(); break;
      case 'vend_stato': statoVenditore(el.getAttribute('data-code'), el.getAttribute('data-val') === '1'); break;
      case 'nl_invia': inviaNewsletter(); break;
      case 'an_ctrl': segnaAnomalia(el.getAttribute('data-tipo'), el.getAttribute('data-rif'), el.getAttribute('data-val') === '1', el); break;
      case 'an_elimina': eliminaOrfano(el); break;
      case 'an_riprova': riprovaPagamento(el.getAttribute('data-id'), el); break;
      case 'push_attiva': attivaPush(); break;
      case 'push_disattiva': disattivaPush(); break;
      case 'push_prova': provaPush(); break;
      case 'push_rimuovi': rimuoviDispositivo(el.getAttribute('data-id')); break;
      case 'tab_cli': F.tabCli = el.getAttribute('data-tab'); F.modificaFatt = false; disegnaScheda(); break;
      case 'f_riprova': FATT = null; FATT_ALTRO = null; disegnaRotta(false); break;
      case 'f_ricarica_cli': SCHEDA_F = null; vistaCliente(rotta().id); break;
      case 'f_anno': F.fattAnno = Number(el.getAttribute('data-anno')); vistaFatture(); break;
      case 'f_tipo_cli':
        FORM.tipo = el.getAttribute('data-val'); sceltaSeg(el, 'f_tipo_cli');
        $('blk_ente').hidden = FORM.tipo === 'persona'; $('blk_persona').hidden = FORM.tipo !== 'persona'; break;
      case 'f_tipo_id': FORM.tipoId = el.getAttribute('data-val'); sceltaSeg(el, 'f_tipo_id'); break;
      case 'f_crea': creaFatturaF(); break;
      case 'f_xml': scaricaXmlF(); break;
      case 'f_caricata': statoFatturaF('caricata'); break;
      case 'f_scarto_apri': UIF.scarto = true; vistaFattura(FDET.id).then(function(){ if($('s_motivo')) $('s_motivo').focus(); }); break;
      case 'f_scarto_annulla': UIF.scarto = false; vistaFattura(FDET.id); break;
      case 'f_scarto_conferma': statoFatturaF('scartata'); break;
      case 'f_correggi_apri': UIF.correggi = true; vistaFattura(FDET.id); break;
      case 'f_correggi_annulla': UIF.correggi = false; vistaFattura(FDET.id); break;
      case 'f_correggi': correggiFatturaF(); break;
      case 'f_scheda_modifica': F.modificaFatt = true; disegnaScheda(); break;
      case 'f_scheda_annulla': F.modificaFatt = false; disegnaScheda(); break;
      case 'f_scheda_salva': salvaSchedaF(); break;
      case 'f_serie_salva': salvaSerieF(); break;
    }
  });

  document.addEventListener('DOMContentLoaded', function(){
    $('lg_btn').addEventListener('click', accedi);
    $('lg_pw').addEventListener('keydown', function(e){ if(e.key === 'Enter') accedi(); });
    $('lg_email').addEventListener('keydown', function(e){ if(e.key === 'Enter') $('lg_pw').focus(); });
    $('btnEsci').addEventListener('click', esci);
    $('btnAggiorna').addEventListener('click', aggiornaTutto);
    window.addEventListener('hashchange', function(){ disegnaRotta(true); });
    // service worker del gestionale (notifiche e installazione come app): nessuna copia delle pagine
    var regSW = registraSW();
    if(regSW) regSW.catch(function(){});
    if('serviceWorker' in navigator){
      navigator.serviceWorker.addEventListener('message', function(ev){
        var d = ev.data || {};
        if(d.tipo !== 'apri' || !d.url || !DATI) return;
        var k = String(d.url).indexOf('#');
        var dest = k >= 0 ? String(d.url).slice(k + 1) : '';
        SCHEDA = null; SCHEDA_F = null; RICH = null; INC = null; FDET = null; FATT_ALTRO = null;
        aggiornaDati(false).then(function(){ return caricaFatture().catch(function(){}); }).then(function(){
          if(dest && location.hash !== '#' + dest) location.hash = dest; else disegnaRotta(false);
        });
      });
    }
    sb.auth.getSession().then(function(s){
      if(s && s.data && s.data.session) avvia(); else mostraLogin();
    }).catch(function(){ mostraLogin(); });
  });
})();

<!DOCTYPE html>
<!-- EventsFun | Gestionale | v2.1 04/10/2026: allegati scaricati direttamente, Prove e omaggi sempre visibili, niente pulsante CSV spento. v2.0 (C7): Riepilogo, Clienti con stati veri, Scheda cliente, Incassi, Assistenza con risposte, Messaggi dal sito, Eventi, Venditori, Newsletter, Da controllare. Dati dal portiere gestionale-api v9. -->
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A0A0A">
<title>Gestionale EventsFun</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0A0A; --card:#121212; --card2:#171717; --nav:#0d0d0d;
  --gold:#C9A96E; --gold2:#E2C792;
  --txt:rgb(245,240,232); --muted:rgba(245,240,232,0.75); --dim:rgba(245,240,232,0.6); --faint:rgba(245,240,232,0.45);
  --line:rgba(245,240,232,0.12); --line2:rgba(245,240,232,0.08);
  --ok:#4ADE80; --warn:#FBBF24; --bad:#F87171; --base:#7DD3FC; --ag:#C4B5FD; --info:#5EEAD4;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--txt);font-family:'DM Sans',system-ui,sans-serif;font-size:14px;line-height:1.45;min-height:100vh}
a{color:var(--gold)}a:hover{color:var(--gold2)}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none !important}

/* ---------- accesso ---------- */
.splash{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--dim)}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.login-box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 22px}
.login-box h1{font-family:'Syne',sans-serif;font-weight:800;font-size:22px;margin:0 0 6px}
.login-box h1 span{color:var(--gold)}
.login-box p{margin:0 0 20px;color:var(--dim);font-size:13px}

/* ---------- barra in alto ---------- */
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));background:rgba(10,10,10,0.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{font-family:'Syne',sans-serif;font-weight:800;font-size:17px;color:var(--txt);text-decoration:none}
.brand span{color:var(--gold)}
.who{font-size:12px;color:var(--dim);margin-top:2px}
.top-act{display:flex;gap:8px}
.ibtn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:10px;border:1px solid rgba(245,240,232,0.14);background:transparent;color:rgba(245,240,232,0.8);cursor:pointer;padding:0;flex-shrink:0}
.ibtn:hover{border-color:rgba(201,169,110,0.5);color:var(--gold)}
.ibtn.gira svg{animation:gira 0.9s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}

/* ---------- impaginazione ---------- */
.shell{display:block}
.side{display:none}
.vista{max-width:720px;margin:0 auto;padding:0 0 calc(96px + env(safe-area-inset-bottom))}
.sec{padding:18px 16px 4px}
.h1{font-family:'Syne',sans-serif;font-weight:800;font-size:22px;line-height:1.2;margin:0;word-break:break-word}
.h2{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;margin:0 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.h2 small{font-family:'DM Sans',sans-serif;font-weight:500;font-size:12px;color:var(--dim)}
.tag{font-size:12px;color:var(--dim)}
.note{font-size:12.5px;color:rgba(245,240,232,0.65);line-height:1.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.card.gold{border-color:rgba(201,169,110,0.55);background:#14110c}
.card.pad{padding:14px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line2);text-decoration:none;color:var(--txt);min-height:44px}
.row:first-child{border-top:0}
a.row:hover,button.row:hover{background:rgba(245,240,232,0.04);color:var(--txt)}
button.row{width:100%;background:transparent;border-left:0;border-right:0;border-bottom:0;font:inherit;text-align:left;cursor:pointer}
.card > button.row:first-child{border-top:0}
.row.top-al{align-items:flex-start}
.grow{flex:1;min-width:0}
.t{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t.wrap{white-space:normal;word-break:break-word}
.s{font-size:12px;color:rgba(245,240,232,0.62);margin-top:2px;word-break:break-word}
.s.chiaro{color:rgba(245,240,232,0.82)}
.estratto{font-size:12.5px;color:rgba(245,240,232,0.72);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.chev{color:rgba(245,240,232,0.4);flex-shrink:0;display:flex}
.importo{font-weight:700;white-space:nowrap;text-align:right}
.vuoto{padding:16px 14px;color:var(--dim);font-size:13px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-block;border-radius:999px;padding:2px 8px;font-size:10.5px;font-weight:700;letter-spacing:0.3px;white-space:nowrap;line-height:1.5}
.p-base{background:rgba(125,211,252,0.15);color:var(--base);border:1px solid rgba(125,211,252,0.35)}
.p-pro{background:rgba(201,169,110,0.15);color:var(--gold);border:1px solid rgba(201,169,110,0.4)}
.p-ag{background:rgba(196,181,253,0.15);color:var(--ag);border:1px solid rgba(196,181,253,0.35)}
.p-info{background:rgba(94,234,212,0.13);color:var(--info);border:1px solid rgba(94,234,212,0.35)}
.p-ok{background:rgba(74,222,128,0.14);color:var(--ok);border:1px solid rgba(74,222,128,0.32)}
.p-warn{background:rgba(251,191,36,0.14);color:var(--warn);border:1px solid rgba(251,191,36,0.32)}
.p-bad{background:rgba(248,113,113,0.14);color:var(--bad);border:1px solid rgba(248,113,113,0.32)}
.p-neu{background:rgba(245,240,232,0.08);color:var(--muted);border:1px solid rgba(245,240,232,0.14)}
.p-gold{background:var(--gold);color:#0A0A0A;border:1px solid var(--gold)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px;flex-shrink:0}
.d-ok{background:var(--ok)}.d-warn{background:var(--warn)}.d-bad{background:var(--bad)}.d-neu{background:rgba(245,240,232,0.45)}.d-gold{background:var(--gold)}
.nums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.num{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-decoration:none;color:var(--txt);display:block;min-width:0}
.num:hover{border-color:rgba(201,169,110,0.45);color:var(--txt)}
.num .n{font-family:'Syne',sans-serif;font-weight:800;font-size:24px;color:var(--gold);line-height:1.1;word-break:break-word}
.num .l{font-size:12px;color:rgba(245,240,232,0.7);margin-top:4px}
.num .x{font-size:11.5px;color:rgba(245,240,232,0.55);margin-top:6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;background:var(--card);border:1px solid rgba(245,240,232,0.14);color:rgba(245,240,232,0.8);border-radius:999px;padding:0 14px;height:38px;font-family:'Syne',sans-serif;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap;text-decoration:none}
.chip b{font-family:'DM Sans',sans-serif;font-size:11px;opacity:0.75}
.chip.on{background:var(--gold);border-color:var(--gold);color:#0A0A0A}
.chip.filtro{border-color:rgba(201,169,110,0.55);color:var(--gold)}
.field{display:block;width:100%;background:var(--card);border:1px solid rgba(245,240,232,0.14);border-radius:10px;padding:12px 14px;color:var(--txt);font-size:16px;min-height:44px}
.field:focus{border-color:rgba(201,169,110,0.6);outline:none}
textarea.field{resize:vertical;min-height:96px;line-height:1.5}
select.field{appearance:auto}
input[type=date].field{color-scheme:dark}
.lbl{display:block;font-size:12px;color:rgba(245,240,232,0.7);margin-bottom:6px;font-weight:500}
.campo{margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;border:0;background:var(--gold);color:#0A0A0A;font-family:'Syne',sans-serif;font-weight:700;font-size:14px;text-decoration:none;cursor:pointer;text-align:center}
.btn:hover{background:var(--gold2);color:#0A0A0A}
.btn.sec2{background:transparent;color:var(--txt);border:1px solid rgba(245,240,232,0.2)}
.btn.sec2:hover{border-color:rgba(201,169,110,0.55);color:var(--gold)}
.btn.rosso{background:transparent;color:var(--bad);border:1px solid rgba(248,113,113,0.4)}
.btn.piccolo{min-height:36px;padding:0 12px;font-size:12.5px}
.btn:disabled{opacity:0.55;cursor:default}
.btn.pieno{width:100%}
.bottoni{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;color:rgba(245,240,232,0.75);text-decoration:none;font-size:14px;padding:0 16px}
.back:hover{color:var(--gold)}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line2)}
.kv > div{background:var(--card);padding:11px 14px;min-width:0}
.k{font-size:11px;color:var(--dim)}
.v{font-size:14px;font-weight:700;margin-top:2px;word-break:break-word}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.seg.q4{grid-template-columns:repeat(2,minmax(0,1fr))}
.seg button{min-height:44px;border-radius:10px;border:1px solid rgba(245,240,232,0.14);background:var(--card);color:rgba(245,240,232,0.8);font-family:'Syne',sans-serif;font-weight:600;font-size:13px;cursor:pointer;padding:4px 6px}
.seg button b{font-family:'DM Sans',sans-serif;font-size:11px;opacity:0.75;margin-left:4px}
.seg button.on{background:var(--gold);border-color:var(--gold);color:#0A0A0A}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;font-size:14px;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--gold);flex-shrink:0}
.msgx{display:none;margin-top:10px;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.5}
.msgx.err{display:block;background:rgba(248,113,113,0.1);border:1px solid rgba(248,113,113,0.35);color:#fca5a5}
.msgx.ok{display:block;background:rgba(74,222,128,0.1);border:1px solid rgba(74,222,128,0.32);color:#86efac}
.msgx.info{display:block;background:rgba(245,240,232,0.05);border:1px solid var(--line);color:var(--muted)}
.caricamento{padding:40px 16px;text-align:center;color:var(--dim)}

/* conversazione */
.bolla{border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.5;margin-bottom:10px}
.b-in{background:var(--card2);border:1px solid var(--line);margin-right:28px}
.b-out{background:rgba(201,169,110,0.12);border:1px solid rgba(201,169,110,0.35);margin-left:28px}
.bh{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;color:var(--dim);margin-bottom:6px;flex-wrap:wrap}
.btesto{white-space:pre-wrap;word-break:break-word}
.allegati{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.allegato{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid rgba(245,240,232,0.2);background:transparent;color:var(--txt);font-size:12.5px;cursor:pointer;max-width:100%}
.allegato span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.allegato:hover{border-color:var(--gold);color:var(--gold)}

/* pagamenti apribili */
details.pag{border-top:1px solid var(--line2)}
.card > details.pag:first-child{border-top:0}
details.pag > summary{list-style:none;cursor:pointer}
details.pag > summary::-webkit-details-marker{display:none}
details.pag[open] > summary{background:rgba(245,240,232,0.03)}
.pag-det{padding:4px 14px 14px;font-size:12.5px;color:var(--muted)}
.pag-det .riga{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px dashed var(--line2)}
.pag-det .bottoni{margin-top:12px}
details.blocco{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
details.blocco > summary{list-style:none;cursor:pointer;padding:12px 14px;min-height:44px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:700}
details.blocco > summary::-webkit-details-marker{display:none}
details.blocco > summary::after{content:'';width:8px;height:8px;border-right:2px solid var(--dim);border-bottom:2px solid var(--dim);transform:rotate(45deg);margin-right:4px;flex-shrink:0}
details.blocco[open] > summary::after{transform:rotate(-135deg)}

/* newsletter e venditori */
.nl-check{display:flex;align-items:center;gap:10px;min-height:44px;padding:4px 14px;border-top:1px solid var(--line2);cursor:pointer}
.nl-check:first-child{border-top:0}
.nl-check input{width:20px;height:20px;accent-color:var(--gold);flex-shrink:0}
.nl-check .grow{font-size:14px}
.nl-n{font-weight:700;color:var(--gold)}
.nl-lista{max-height:320px;overflow-y:auto;border-top:1px solid var(--line2)}
.nl-dest{display:flex;align-items:center;gap:10px;padding:8px 14px;border-top:1px solid var(--line2);cursor:pointer}
.nl-dest:first-child{border-top:0}
.nl-dest input{width:18px;height:18px;accent-color:var(--gold);flex-shrink:0}
.nl-badge{display:inline-block;font-size:10px;padding:1px 6px;border-radius:999px;background:rgba(245,240,232,0.08);color:var(--muted);margin-left:4px}
.tok{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;color:var(--dim);word-break:break-all}

/* barra in basso (telefono e tablet) */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:50;height:calc(68px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--nav);border-top:1px solid var(--line)}
.nav a{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;color:rgba(245,240,232,0.6);text-decoration:none;min-width:0}
.nav a.on{color:var(--gold)}
.nb{position:absolute;top:6px;left:50%;margin-left:6px;background:var(--bad);color:#fff;border-radius:999px;font-size:10px;font-weight:700;padding:1px 6px;line-height:1.4}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;background:#1d1a14;border:1px solid rgba(201,169,110,0.5);color:var(--txt);border-radius:12px;padding:10px 16px;font-size:13.5px;max-width:calc(100% - 32px);box-shadow:0 8px 30px rgba(0,0,0,0.5);display:none}
.toast.on{display:block}
.toast.err{border-color:rgba(248,113,113,0.6)}

/* riepilogo a due colonne sul computer */
.rgrid{display:block}

@media (min-width:900px){
  .top{padding:14px 24px}
  .shell{display:flex;gap:24px;max-width:1360px;margin:0 auto;padding:24px}
  .side{display:flex;flex-direction:column;gap:4px;flex:0 0 220px;position:sticky;top:96px;align-self:flex-start}
  .side a{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:42px;padding:0 12px;border-radius:9px;text-decoration:none;font-size:14px;font-weight:500;color:rgba(245,240,232,0.78)}
  .side a:hover{background:rgba(245,240,232,0.04);color:var(--txt)}
  .side a.on{background:rgba(201,169,110,0.14);color:var(--gold)}
  .side hr{border:0;border-top:1px solid var(--line);margin:8px 0;width:100%}
  .vista{flex:1;min-width:0;max-width:1060px;margin:0;padding:0 0 40px}
  .vista .sec{padding-left:0;padding-right:0}
  .vista .chips{padding-left:0;padding-right:0}
  .vista .back{padding-left:0}
  .nav{display:none}
  .toast{bottom:28px}
  .nums.q4{grid-template-columns:repeat(4,minmax(0,1fr))}
  .rgrid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:0 24px;align-items:start}
  .stretta{max-width:760px}
}
@media (prefers-reduced-motion:reduce){.ibtn.gira svg{animation:none}}
</style>
</head>
<body>

<div id="splash" class="splash">Caricamento...</div>

<!-- ACCESSO -->
<div id="loginView" class="login" hidden>
  <div class="login-box">
    <h1>Gestionale <span>EventsFun</span></h1>
    <p>Accesso riservato.</p>
    <div class="campo"><label class="lbl" for="lg_email">Email</label><input class="field" type="email" id="lg_email" autocomplete="username"></div>
    <div class="campo"><label class="lbl" for="lg_pw">Password</label><input class="field" type="password" id="lg_pw" autocomplete="current-password"></div>
    <button class="btn pieno" id="lg_btn" type="button">Accedi</button>
    <div class="msgx" id="lg_msg"></div>
  </div>
</div>

<!-- APP -->
<div id="appView" hidden>
  <header class="top">
    <div><a class="brand" href="#riepilogo">Gestionale <span>EventsFun</span></a><div class="who" id="who"></div></div>
    <div class="top-act">
      <button class="ibtn" id="btnAggiorna" type="button" aria-label="Aggiorna i dati" title="Aggiorna i dati"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"></path><path d="M20 5v6h-6"></path></svg></button>
      <button class="ibtn" id="btnEsci" type="button" aria-label="Esci" title="Esci"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4v16h-4"></path><path d="M10 8l-4 4 4 4"></path><path d="M6 12h10"></path></svg></button>
    </div>
  </header>
  <div class="shell">
    <nav class="side" id="side" aria-label="Sezioni">
      <a href="#riepilogo" data-v="riepilogo">Riepilogo</a>
      <a href="#clienti" data-v="clienti">Clienti</a>
      <a href="#incassi" data-v="incassi">Incassi</a>
      <a href="#assistenza" data-v="assistenza">Assistenza<span class="pill p-bad" id="sbAss" hidden></span></a>
      <hr>
      <a href="#eventi" data-v="eventi">Eventi</a>
      <a href="#messaggi" data-v="messaggi">Messaggi dal sito<span class="pill p-warn" id="sbMsg" hidden></span></a>
      <a href="#venditori" data-v="venditori">Venditori</a>
      <a href="#newsletter" data-v="newsletter">Newsletter</a>
      <a href="#controllo" data-v="controllo">Da controllare<span class="pill p-bad" id="sbCtrl" hidden></span></a>
    </nav>
    <main class="vista" id="vista"></main>
  </div>
  <nav class="nav" id="nav" aria-label="Sezioni">

    var s = await sb.auth.getSession();
    var token = s && s.data && s.data.session ? s.data.session.access_token : null;
    if(!token){ var e0 = new Error('NO_SESSION'); e0.status = 401; throw e0; }
    var payload = { action: azione };
    if(extra){ for(var k in extra){ if(Object.prototype.hasOwnProperty.call(extra, k)) payload[k] = extra[k]; } }
    var r;
    try{
      r = await fetch(FN_URL, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token }, body: JSON.stringify(payload) });
    }catch(errRete){
      throw new Error('Connessione assente o instabile. Riprova tra poco.');
    }
    var j = null;
    try{ j = await r.json(); }catch(e){ j = null; }
    if(!r.ok){
      var err = new Error((j && j.error) ? j.error : ('Errore ' + r.status));
      err.status = r.status;

    return j;
  }

    if(n > 0){ el.textContent = n; el.hidden = false; } else { el.hidden = true; }
  }

  // ---------------- rotte ----------------
  function rotta(){
    var h = decodeURIComponent(location.hash.replace(/^#/, '')) || 'riepilogo';
    var i = h.indexOf('/');
    return { v: i >= 0 ? h.slice(0, i) : h, id: i >= 0 ? h.slice(i + 1) : '' };
  }
  function vai(h){
    if(location.hash === '#' + h) disegnaRotta(true); else location.hash = h;
  }
  var SEZIONE_NAV = { riepilogo: 'riepilogo', clienti: 'clienti', cliente: 'clienti', incassi: 'incassi', assistenza: 'assistenza', richiesta: 'assistenza', altro: 'altro', eventi: 'altro', messaggi: 'altro', venditori: 'altro', newsletter: 'altro', controllo: 'altro' };
  var SEZIONE_SIDE = { riepilogo: 'riepilogo', clienti: 'clienti', cliente: 'clienti', incassi: 'incassi', assistenza: 'assistenza', richiesta: 'assistenza', altro: 'riepilogo', eventi: 'eventi', messaggi: 'messaggi', venditori: 'venditori', newsletter: 'newsletter', controllo: 'controllo' };
  function disegnaRotta(inCima){
    if(!DATI) return;
    var r = rotta();
    var chiave = r.v + '/' + r.id;
    if(chiave !== ULTIMA_ROTTA) inCima = true;
    ULTIMA_ROTTA = chiave;
    var nav = SEZIONE_NAV[r.v] || 'riepilogo';
    var side = SEZIONE_SIDE[r.v] || 'riepilogo';
    Array.prototype.forEach.call(document.querySelectorAll('#nav a'), function(a){
      var on = a.getAttribute('data-v') === nav;
      a.classList.toggle('on', on);
      if(on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    Array.prototype.forEach.call(document.querySelectorAll('#side a'), function(a){
      var on = a.getAttribute('data-v') === side;
      a.classList.toggle('on', on);
      if(on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    switch(r.v){
      case 'clienti': vistaClienti(r.id); break;
      case 'cliente': vistaCliente(r.id); break;
      case 'incassi': vistaIncassi(); break;
      case 'assistenza': vistaAssistenza(); break;
      case 'richiesta': vistaRichiesta(r.id); break;
      case 'altro': vistaAltro(); break;
      case 'eventi': vistaEventi(); break;
      case 'messaggi': vistaMessaggi(); break;
      case 'venditori': vistaVenditori(); break;
      case 'newsletter': vistaNewsletter(); break;
      case 'controllo': vistaControllo(); break;
      default: vistaRiepilogo();
    }
    if(inCima) window.scrollTo(0, 0);
  }
  function metti(h){ $('vista').innerHTML = h; }

  // ---------------- RIEPILOGO ----------------
  function vistaRiepilogo(){
    var cl = DATI.clienti || [];
    var rp = DATI.riepilogo || {};

    numeri += '<a class="num" href="#clienti/abbonamenti"><div class="n">' + abb.length + '</div><div class="l">Abbonamenti attivi</div><div class="x">' + abbAg + ' Agenzia, ' + abbInfo + ' Punto Info' + (abbMan ? ', ' + abbMan + (abbMan === 1 ? ' manuale' : ' manuali') : '') + '</div></a>';
    numeri += '<a class="num" href="#eventi"><div class="n">' + (rp.eventi_in_corso || 0) + '</div><div class="l">Eventi in corso</div><div class="x">' + (rp.iscritti_eventi_in_corso || 0) + ' iscritti in totale</div></a>';
    numeri += '</div>';

    // da fare adesso
    var fare = [];
    ordinaRichieste(assDaGestire(), true).forEach(function(r){

      sotto += ', ' + esc(Number(r.n_messaggi) > 1 ? 'ha risposto ' + fa(r.ultimo_messaggio_at) : fa(r.ultimo_messaggio_at));
      fare.push('<a class="row" href="#richiesta/' + esc(r.id) + '"><div class="grow"><div class="pills" style="margin-bottom:4px">' + pillsRichiesta(r) + '</div><div class="t">' + esc(ARGOMENTI[r.argomento] || 'Richiesta') + ' (n. ' + esc(r.numero) + ')</div><div class="s">' + sotto + '</div></div>' + ICO_CHEV + '</a>');
    });
    msgDaGestire().forEach(function(m){
      var cosa = m.piano ? 'interessato a: ' + m.piano : (m.messaggio ? String(m.messaggio).slice(0, 80) : 'senza messaggio');
      fare.push('<a class="row" href="#messaggi"><div class="grow"><div class="t">Nuovo messaggio dal sito</div><div class="s">' + esc((m.nome || '') + ' ' + (m.cognome || '')) + ', ' + esc(cosa) + '</div></div>' + ICO_CHEV + '</a>');
    });
    var nC = anomalieTot();
    if(nC) fare.push('<a class="row" href="#controllo"><div class="grow"><div class="t">' + (nC === 1 ? '1 cosa da controllare' : nC + ' cose da controllare') + '</div><div class="s">Situazioni che non tornano nei dati</div></div>' + ICO_CHEV + '</a>');
    var daFare = '<div class="sec"><div class="h2">Da fare adesso <small>' + (fare.length === 1 ? '1 cosa' : fare.length + ' cose') + '</small></div>';
    daFare += fare.length ? '<div class="card gold">' + fare.join('') + '</div>' : '<div class="card"><div class="vuoto">Niente da fare adesso.</div></div>';
    daFare += '</div>';

    // abbonamenti
    var nR = cl.filter(rinnovoEntro7).length;
    var nD = cl.filter(function(c){ return abbonamento(c.piano) && codiceStato(c) === 'disdetta_programmata'; }).length;
    var nP = cl.filter(function(c){ return abbonamento(c.piano) && codiceStato(c) === 'pagamento_non_riuscito'; }).length;
    var nF = cl.filter(function(c){ return abbonamento(c.piano) && codiceStato(c) === 'fine_accesso'; }).length;
    var rigaAbb = function(dot, testo, n, filtro){
      return '<a class="row" href="#clienti/' + filtro + '"><span class="dot ' + dot + '"></span><div class="grow"><div class="t" style="font-weight:500">' + testo + '</div></div><b>' + n + '</b>' + ICO_CHEV + '</a>';
    };
    var abbH = '<div class="sec"><div class="h2">Abbonamenti <small>Agenzia e Punto Info</small></div><div class="card">';
    abbH += rigaAbb('d-ok', 'Si rinnovano nei prossimi 7 giorni', nR, 'rinnovi7');
    abbH += rigaAbb('d-warn', 'Disdette programmate', nD, 'disdetta_programmata');
    abbH += rigaAbb('d-bad', 'Pagamenti non riusciti', nP, 'pagamento_non_riuscito');
    abbH += rigaAbb('d-neu', 'Finiti, ultimi 7 giorni di accesso', nF, 'fine_accesso');
    abbH += '</div></div>';

    // novita'
    var nov = DATI.novita || [];
    var novH = '<div class="sec"><div class="h2">Ultime novità <small>ultimi 30 giorni</small></div><div class="card">';
    if(!nov.length) novH += '<div class="vuoto">Nessuna novità negli ultimi 30 giorni.</div>';
    nov.forEach(function(n){
      var dett = [quando(n.quando)];
      if(n.tipo === 'nuovo_cliente' || n.tipo === 'rinnovo'){
        dett.push(nomePiano(n.piano) + (n.periodo ? ' ' + n.periodo : ''));
        if(n.importo !== null && n.importo !== undefined) dett.push(euroCorto(n.importo));
        var tit = (n.tipo === 'nuovo_cliente' ? 'Nuovo cliente: ' : 'Rinnovo: ') + (n.nome || n.email || 'cliente');
        novH += '<a class="row" href="#cliente/' + esc(n.order_id) + '"><div class="grow"><div class="t">' + esc(tit) + '</div><div class="s">' + esc(dett.join(', ')) + '</div></div>' + ICO_CHEV + '</a>';
      }else{
        dett.push(n.nome || n.email || '');
        novH += '<a class="row" href="#assistenza"><div class="grow"><div class="t">Richiesta n. ' + esc(n.numero) + ' risolta</div><div class="s">' + esc(dett.filter(Boolean).join(', ')) + '</div></div>' + ICO_CHEV + '</a>';
      }
    });
    novH += '</div></div>';

    h += '<div class="sec"><div class="h2">I numeri</div>' + numeri + '</div>';
    h += '<div class="rgrid"><div>' + daFare + '</div><div>' + abbH + novH + '</div></div>';

  // ---------------- CLIENTI ----------------
  var FILTRI_STATO = {
    attivi: { testo: 'Clienti attivi', f: clienteAttivo },
    abbonamenti: { testo: 'Abbonamenti attivi', f: abbonamentoAttivo },
    rinnovi7: { testo: 'Si rinnovano nei prossimi 7 giorni', f: rinnovoEntro7 },
    disdetta_programmata: { testo: 'Disdette programmate', f: function(c){ return abbonamento(c.piano) && codiceStato(c) === 'disdetta_programmata'; } },
    pagamento_non_riuscito: { testo: 'Pagamenti non riusciti', f: function(c){ return abbonamento(c.piano) && codiceStato(c) === 'pagamento_non_riuscito'; } },
    fine_accesso: { testo: 'Finiti, ultimi 7 giorni di accesso', f: function(c){ return abbonamento(c.piano) && codiceStato(c) === 'fine_accesso'; } }
  };
  function eventiPerCliente(){
    var m = {};
    (DATI.eventi || []).forEach(function(e){ if(e.cliente_id){ (m[e.cliente_id] = m[e.cliente_id] || []).push(String(e.nome || '').toLowerCase()); } });
    return m;
  }
  function vistaClienti(filtroStato){
    var h = '';
    h += '<div class="sec"><div style="position:relative"><span style="position:absolute;left:13px;top:13px;color:rgba(245,240,232,0.5)">' + ICO_CERCA + '</span><input class="field" style="padding-left:40px" type="search" id="cli_q" aria-label="Cerca un cliente" placeholder="Cerca per nome, email o evento" value="' + esc(F.q) + '"></div></div>';
    h += '<div class="chips" style="padding-top:12px" id="cli_chips"></div>';
    h += '<div class="sec" style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:12px;flex-wrap:wrap"><div class="tag" id="cli_n"></div>';
    h += '<label style="display:flex;align-items:center;gap:8px;font-size:13px;color:rgba(245,240,232,0.75)">Ordina <select class="field" id="cli_ord" style="width:auto;padding:8px 10px;font-size:14px;min-height:40px">';
    [['recenti','Più recenti'],['nome','Nome'],['rinnovo','Prossimo rinnovo'],['incassato','Incassato']].forEach(function(o){
      h += '<option value="' + o[0] + '"' + (F.cliOrd === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';
    });
    h += '</select></label></div>';
    h += '<div class="sec" style="padding-top:8px"><div class="card" id="cli_lista"></div></div>';
    metti(h);
    $('cli_q').addEventListener('input', function(){ F.q = this.value; listaClienti(filtroStato); });
    $('cli_ord').addEventListener('change', function(){ F.cliOrd = this.value; listaClienti(filtroStato); });
    listaClienti(filtroStato);
  }
  function listaClienti(filtroStato){
    var tutti = DATI.clienti || [];
    var fs = FILTRI_STATO[filtroStato] || null;
    var base = fs ? tutti.filter(fs.f) : tutti;
    var conta = function(fn){ return base.filter(fn).length; };
    var chipsDef = [
      ['tutti', 'Tutti', function(){ return true; }],
      ['base', 'Base', function(c){ return c.piano === 'base'; }],
      ['pro', 'Pro', function(c){ return c.piano === 'pro'; }],
      ['agenzia', 'Agenzia', function(c){ return c.piano === 'agenzia'; }],
      ['info', 'Punto Info', function(c){ return c.piano === 'info'; }],
      ['manuali', 'Accessi manuali', accessoManuale]
    ];
    var ch = '';
    if(fs) ch += '<a class="chip filtro" href="#clienti" aria-label="Togli il filtro">' + esc(fs.testo) + ' <span aria-hidden="true">&#10005;</span></a>';
    var filtroPiano = function(){ return true; };
    chipsDef.forEach(function(d){
      if(F.cli === d[0]) filtroPiano = d[2];
      ch += '<button class="chip' + (F.cli === d[0] ? ' on' : '') + '" type="button" data-fcli="' + d[0] + '">' + d[1] + ' <b>' + conta(d[2]) + '</b></button>';
    });
    $('cli_chips').innerHTML = ch;
    var q = F.q.trim().toLowerCase();
    var evMap = q ? eventiPerCliente() : {};
    var lista = base.filter(filtroPiano).filter(function(c){
      if(!q) return true;
      var testo = (nomeCliente(c) + ' ' + (c.email || '')).toLowerCase();
      if(testo.indexOf(q) >= 0) return true;
      return (evMap[c.id] || []).some(function(n){ return n.indexOf(q) >= 0; });
    });
    lista.sort(function(a, b){
      if(F.cliOrd === 'nome') return nomeCliente(a).localeCompare(nomeCliente(b), 'it', { sensitivity: 'base' });
      if(F.cliOrd === 'rinnovo'){
        var ra = a.subscription_renews_at ? new Date(a.subscription_renews_at).getTime() : Infinity;
        var rb = b.subscription_renews_at ? new Date(b.subscription_renews_at).getTime() : Infinity;
        if(ra !== rb) return ra - rb;
      }
      if(F.cliOrd === 'incassato'){
        var d = Number(b.incassato_reale || 0) - Number(a.incassato_reale || 0);
        if(d) return d;
      }
      return new Date(b.created_at).getTime() - new Date(a.created_at).getTime();
    });
    $('cli_n').textContent = lista.length === 1 ? '1 cliente' : lista.length + ' clienti';
    var h = '';
    if(!lista.length) h = '<div class="vuoto">Nessun cliente con questi filtri.</div>';
    lista.forEach(function(c){
      var si = statoInfo(c);
      var extra = '';
      if(F.cliOrd === 'incassato') extra = '<div class="importo" style="font-size:13px">' + esc(euro(c.incassato_reale)) + '</div>';
      h += '<a class="row" href="#cliente/' + esc(c.id) + '"><div class="grow"><div style="display:flex;align-items:center;gap:8px;min-width:0"><div class="t">' + esc(nomeCliente(c)) + '</div>' + pianoPill(c.piano) + '</div>';
      h += '<div class="s">' + (c.email ? esc(c.email) : '<span style="color:var(--bad)">email mancante</span>') + '</div>';
      h += '<div class="s chiaro"><span class="dot ' + si.dot + '"></span>' + esc(si.testo) + (Number(c.assistenza_aperte) ? ', <span style="color:var(--warn)">assistenza aperta</span>' : '') + '</div></div>' + extra + ICO_CHEV + '</a>';
    });
    $('cli_lista').innerHTML = h;
  }

  // ---------------- SCHEDA CLIENTE ----------------
  async function vistaCliente(id){
    if(SCHEDA && SCHEDA.cliente && SCHEDA.cliente.id === id){ disegnaScheda(); return; }
    metti('<a class="back" href="#clienti">' + ICO_BACK + 'Clienti</a><div class="caricamento">Caricamento della scheda...</div>');
    try{
      var res = await chiedi('cliente', { order_id: id });
      if(rotta().v !== 'cliente' || rotta().id !== id) return;
      SCHEDA = res.dati;
      disegnaScheda();
    }catch(e){
      if(!gestisciErrore(e)) metti('<a class="back" href="#clienti">' + ICO_BACK + 'Clienti</a><div class="sec"><div class="msgx err">Scheda non disponibile: ' + esc(e.message) + '</div></div>');
    }
  }
  function venditoreNome(code){
    if(!code) return 'Nessuno';
    for(var i = 0; i < VENDITORI.length; i++){ if(VENDITORI[i].code === code) return VENDITORI[i].nome; }
    return code;
  }
  function etichettaEvento(e){
    if(e.bozza) return '<span class="pill p-warn">Bozza</span>';
    if(e.concluso) return '<span class="pill p-neu">Concluso</span>';
    if(e.attivo === false) return '<span class="pill p-bad">Chiuso</span>';
    return '<span class="pill p-ok">Attivo</span>';
  }
  function numeriEvento(e){
    var mod = e.modalita || 'iscrizioni';
    var ric = Number(e.n_richieste || 0);
    var testoRic = ric === 1 ? '1 richiesta' : ric + ' richieste';
    if(mod === 'info') return 'solo informazioni, ' + testoRic;
    var t = (e.n_iscritti || 0) + (e.capienza ? ' iscritti su ' + e.capienza : ' iscritti');
    if(Number(e.n_attesa || 0)) t += ', ' + e.n_attesa + ' in lista d\'attesa';
    if(mod === 'entrambe') t += ', ' + testoRic;
    return t;
  }

    var disdetta = c.subscription_cancel_at ? 'Programmata, fino ' + art('al', dataBreve(c.subscription_cancel_at)) : (c.subscription_expires_at && (codiceStato(c) === 'fine_accesso' || codiceStato(c) === 'scaduto') ? 'Annullato, accesso fino ' + art('al', dataBreve(c.subscription_expires_at)) : 'Nessuna');
    h += '<div class="sec"><div class="card"><div class="kv">';

    h += '<div><div class="k">Venditore</div><div class="v">' + esc(venditoreNome(c.sales_agent)) + '</div></div>';
    h += '<div><div class="k">Area personale</div><div class="v">' + (c.ha_accesso_al_sito ? 'Password impostata' : 'Mai entrato') + '</div></div>';
    h += '<div><div class="k">Newsletter</div><div class="v">' + (c.newsletter ? 'Consenso dato' : 'Nessun consenso') + '</div></div>';
    h += '</div></div>';
    // azioni
    h += '<div class="bottoni" style="margin-top:10px">';

      h += '<button class="btn" type="button" disabled>Nessun accesso attivo</button>';
    }else{
      h += '<a class="btn" target="_blank" rel="noopener" href="' + esc(dashUrl(c.piano, accessi[0].token)) + '">Apri la dashboard (accesso 1)</a>';

    h += '<button class="btn sec2" type="button" data-az="scrivi"' + (c.email ? '' : ' disabled') + '>' + ICO_PENNA + 'Scrivi</button>';
    h += '</div>';
    if(accessi.length > 1){
      h += '<div class="bottoni" style="margin-top:8px">';
      accessi.slice(1).forEach(function(a, i){
        h += '<a class="btn sec2" target="_blank" rel="noopener" href="' + esc(dashUrl(c.piano, a.token)) + '">Apri la dashboard (accesso ' + (i + 2) + ')</a>';
      });

  // ---------------- INCASSI ----------------
  function periodo(per){
    var o = parteData(oggi());
    var due = function(n){ return String(n).padStart(2, '0'); };
    if(per === 'mese') return { dal: o.a + '-' + due(o.m) + '-01', al: oggi() };
    if(per === 'mese_scorso'){
      var a = o.m === 1 ? o.a - 1 : o.a, m = o.m === 1 ? 12 : o.m - 1;
      var ultimo = new Date(Date.UTC(a, m, 0)).getUTCDate();
      return { dal: a + '-' + due(m) + '-01', al: a + '-' + due(m) + '-' + due(ultimo) };
    }
    if(per === 'anno') return { dal: o.a + '-01-01', al: oggi() };
    return { dal: F.incDal || (o.a + '-' + due(o.m) + '-01'), al: F.incAl || oggi() };
  }
  function vistaIncassi(){
    var p = periodo(F.incPer);
    F.incDal = p.dal; F.incAl = p.al;
    var h = '<div class="stretta">';
    h += '<div class="sec" style="padding-bottom:12px"><h1 class="h1">Incassi</h1><div class="note" style="margin-top:4px">Solo i pagamenti reali: prove e omaggi sono tenuti a parte.</div></div>';
    h += '<div class="chips">';
    [['mese','Questo mese'],['mese_scorso','Mese scorso'],['anno','Quest\'anno'],['date','Da data a data']].forEach(function(x){
      h += '<button class="chip' + (F.incPer === x[0] ? ' on' : '') + '" type="button" data-per="' + x[0] + '">' + x[1] + '</button>';
    });
    h += '</div>';
    h += '<div class="sec" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding-top:12px">';
    h += '<div><label class="lbl" for="inc_dal">Dal</label><input class="field" id="inc_dal" type="date" value="' + esc(p.dal) + '"></div>';
    h += '<div><label class="lbl" for="inc_al">Al</label><input class="field" id="inc_al" type="date" value="' + esc(p.al) + '"></div></div>';
    h += '<div class="chips" style="padding-top:12px">';
    [['','Tutti i pacchetti'],['base','Base'],['pro','Pro'],['agenzia','Agenzia'],['info','Punto Info']].forEach(function(x){
      h += '<button class="chip' + (F.incPiano === x[0] ? ' on' : '') + '" type="button" data-piano="' + x[0] + '">' + x[1] + '</button>';
    });
    h += '</div>';
    h += '<div class="sec" style="padding-top:8px"><label class="chk"><input type="checkbox" id="inc_sconto"' + (F.incSconto ? ' checked' : '') + '>Solo pagamenti con sconto</label></div>';
    h += '<div id="inc_corpo"><div class="caricamento">Caricamento degli incassi...</div></div>';
    h += '</div>';
    metti(h);
    $('inc_dal').addEventListener('change', function(){ F.incPer = 'date'; F.incDal = this.value; INC = null; vistaIncassi(); });
    $('inc_al').addEventListener('change', function(){ F.incPer = 'date'; F.incAl = this.value; INC = null; vistaIncassi(); });
    $('inc_sconto').addEventListener('change', function(){ F.incSconto = this.checked; INC = null; caricaIncassi(); });
    caricaIncassi();
  }
  function chiaveIncassi(){ return [F.incDal, F.incAl, F.incPiano, F.incSconto].join('|'); }
  async function caricaIncassi(){
    var corpo = $('inc_corpo');
    if(!F.incDal || !F.incAl){ corpo.innerHTML = '<div class="sec"><div class="msgx err">Scegli le due date.</div></div>'; return; }
    if(F.incDal > F.incAl){ corpo.innerHTML = '<div class="sec"><div class="msgx err">La data "Dal" è dopo la data "Al".</div></div>'; return; }
    var chiave = chiaveIncassi();
    if(INC && INC.chiave === chiave){ disegnaIncassi(); return; }
    corpo.innerHTML = '<div class="caricamento">Caricamento degli incassi...</div>';
    try{
      var res = await chiedi('incassi', { dal: F.incDal, al: F.incAl, piano: F.incPiano, solo_sconto: F.incSconto });
      if(chiave !== chiaveIncassi() || rotta().v !== 'incassi') return;
      INC = { chiave: chiave, d: res.dati || {} };
      disegnaIncassi();
    }catch(e){
      if(!gestisciErrore(e)) corpo.innerHTML = '<div class="sec"><div class="msgx err">Incassi non disponibili: ' + esc(e.message) + '</div></div>';
    }
  }
  function tipoPagamento(p){
    if(p.tipo === 'rinnovo') return 'rinnovo';
    if(p.tipo === 'rimborso') return 'rimborso';
    if(p.tipo === 'manuale') return 'registrato a mano';
    return abbonamento(p.piano) ? 'primo pagamento' : 'acquisto';
  }
  function rigaPagamento(p, reale){
    var sconto = Number(p.sconto || 0) > 0 ? '<span style="color:var(--warn)">' + esc((p.codice_sconto ? p.codice_sconto + ' ' : '') + '-' + euro(p.sconto)) + '</span>' : 'nessuno';
    var sotto = dataBreve(p.pagato_il) + ', ' + tipoPagamento(p) + (p.periodo ? ', ' + p.periodo : '');
    var h = '<details class="pag"><summary class="row top-al"><div class="grow"><div style="display:flex;align-items:center;gap:8px;min-width:0"><div class="t">' + esc(p.cliente_nome || p.cliente_email || 'Cliente non collegato') + '</div>' + pianoPill(p.piano) + '</div>';
    h += '<div class="s">' + esc(sotto) + '</div>';
    if(p.tipo !== 'rimborso') h += '<div class="s">Listino ' + esc(euro(p.listino)) + ', sconto ' + sconto + '</div>';
    if(!p.completato && p.tipo !== 'rimborso') h += '<div class="s" style="color:var(--warn)">Dettagli Stripe in arrivo</div>';
    h += '</div><div class="importo"' + (Number(p.importo) < 0 ? ' style="color:var(--bad)"' : '') + '>' + esc(euro(p.importo)) + '</div></summary>';
    h += '<div class="pag-det">';
    if(p.tipo !== 'rimborso') h += '<div class="riga"><span>Commissioni Stripe</span><b>' + (p.commissioni === null || p.commissioni === undefined ? 'non ancora lette' : '-' + esc(euro(p.commissioni))) + '</b></div>';
    if(p.commissioni !== null && p.commissioni !== undefined) h += '<div class="riga"><span>Arrivato a te</span><b>' + esc(euro(Number(p.importo) - Number(p.commissioni))) + '</b></div>';
    if(p.cliente_email) h += '<div class="riga"><span>Email</span><span>' + esc(p.cliente_email) + '</span></div>';
    h += '<div class="riga"><span>Riferimento Stripe</span><span class="tok">' + esc(p.stripe_id || 'nessuno') + '</span></div>';
    var spostabile = !(p.tipo === 'rimborso' && p.rimborso_di) && ME.ruolo === 'admin';
    h += '<div class="bottoni">';
    if(p.cliente_id) h += '<a class="btn sec2 piccolo" href="#cliente/' + esc(p.cliente_id) + '">Scheda cliente</a>';
    if(spostabile){
      if(reale) h += '<button class="btn sec2 piccolo" type="button" data-az="cat" data-id="' + esc(p.id) + '" data-cat="prova">Sposta in prove e omaggi</button>';
      else h += '<button class="btn sec2 piccolo" type="button" data-az="cat" data-id="' + esc(p.id) + '" data-cat="reale">Riporta negli incassi reali</button>';
    }
    h += '</div>';
    if(p.tipo === 'rimborso' && p.rimborso_di) h += '<div class="note" style="margin-top:8px">Un rimborso segue il pagamento a cui è collegato.</div>';
    h += '</div></details>';
    return h;
  }
  function disegnaIncassi(){
    var d = INC.d || {};
    var r = d.riepilogo || {};
    var righe = d.righe || [];
    var reali = righe.filter(function(p){ return p.categoria === 'reale'; });
    var prove = righe.filter(function(p){ return p.categoria !== 'reale'; });
    var h = '';
    h += '<div class="sec" style="padding-top:4px"><div class="card gold">';
    h += '<div class="row"><div class="grow">Prezzo di listino</div><b>' + esc(euro(r.listino)) + '</b></div>';
    h += '<div class="row"><div class="grow">Sconti applicati</div><b style="color:var(--warn)">' + (Number(r.sconti) ? '-' : '') + esc(euro(r.sconti)) + '</b></div>';
    h += '<div class="row"><div class="grow"><b>Pagato dai clienti</b></div><b style="font-family:\'Syne\',sans-serif;font-size:20px;color:var(--gold)">' + esc(euro(r.pagato)) + '</b></div>';
    if(Number(r.rimborsi)) h += '<div class="row"><div class="grow">Rimborsi</div><b style="color:var(--bad)">' + esc(euro(r.rimborsi)) + '</b></div>';
    h += '<div class="row"><div class="grow">Commissioni Stripe</div><b>' + (Number(r.commissioni) ? '-' : '') + esc(euro(r.commissioni)) + '</b></div>';
    h += '<div class="row"><div class="grow"><b>Arrivato a te</b></div><b>' + esc(euro(r.netto)) + '</b></div>';
    h += '</div>';
    var np = Number(r.n_pagamenti || 0);
    var testoP = (np === 1 ? '1 pagamento' : np + ' pagamenti') + (Number(r.n_rimborsi) ? ' e ' + (r.n_rimborsi === 1 ? '1 rimborso' : r.n_rimborsi + ' rimborsi') : '') + ' ' + art('dal', dataLunga(F.incDal)) + ' ' + art('al', dataLunga(F.incAl)) + '.';
    h += '<div class="note" style="margin-top:8px">' + esc(testoP) + '</div>';
    if(Number(r.n_in_completamento)) h += '<div class="note" style="margin-top:4px;color:var(--warn)">' + (r.n_in_completamento === 1 ? '1 pagamento appena arrivato: sconto e commissioni' : r.n_in_completamento + ' pagamenti appena arrivati: sconti e commissioni') + ' si completano da soli entro un\'ora circa.</div>';
    h += '</div>';

    var pp = d.per_pacchetto || [];
    if(pp.length){
      h += '<div class="sec"><div class="h2">Per pacchetto</div><div class="card">';
      pp.forEach(function(x){
        var parti = [];
        if(Number(x.nuovi)) parti.push(abbonamento(x.piano) ? (x.nuovi === 1 ? '1 nuovo' : x.nuovi + ' nuovi') : (x.nuovi === 1 ? '1 acquisto' : x.nuovi + ' acquisti'));
        if(Number(x.rinnovi)) parti.push(x.rinnovi === 1 ? '1 rinnovo' : x.rinnovi + ' rinnovi');
        if(Number(x.rimborsi)) parti.push('rimborsi ' + euro(x.rimborsi));
        h += '<div class="row">' + pianoPill(x.piano) + '<div class="grow s" style="margin:0">' + esc(parti.join(', ')) + '</div><b>' + esc(euro(Number(x.pagato) + Number(x.rimborsi || 0))) + '</b></div>';
      });
      h += '</div></div>';
    }
    var cod = d.codici || [];
    if(cod.length){
      h += '<div class="sec"><div class="h2">Codici sconto usati</div><div class="card">';
      cod.forEach(function(x){
        var piani = (x.piani || []).map(nomePiano).join(', ');
        h += '<div class="row"><div class="grow"><div class="t">' + esc(x.codice) + '</div><div class="s">' + (x.n === 1 ? '1 volta' : x.n + ' volte') + (piani ? ', ' + esc(piani) : '') + '</div></div><b style="color:var(--warn)">-' + esc(euro(x.sconto)) + '</b></div>';
      });
      h += '</div></div>';
    }
    h += '<div class="sec"><div class="h2">Pagamenti <small>' + reali.length + '</small></div><div class="card">';
    if(!reali.length) h += '<div class="vuoto">Nessun pagamento reale in questo periodo.</div>';
    reali.forEach(function(p){ h += rigaPagamento(p, true); });
    h += '</div>' + (reali.length ? '<div class="note" style="margin-top:6px">Tocca un pagamento per vedere commissioni e riferimenti.</div>' : '') + '</div>';
    h += '<div class="sec"><details class="blocco"><summary>Prove e omaggi <span class="pill p-neu" style="margin-left:auto">' + prove.length + '</span></summary><div style="border-top:1px solid var(--line2)">';
    if(!prove.length) h += '<div class="vuoto">Nessuna prova o omaggio in questo periodo.</div>';
    prove.forEach(function(p){ h += rigaPagamento(p, false); });
    h += '</div></details><div class="note" style="margin-top:6px">Non entrano nei totali: sono pagamenti di prova, coupon al 100% e accessi regalati.</div></div>';
    if(righe.length) h += '<div class="sec"><button class="btn sec2 pieno" type="button" data-az="csv">Scarica in Excel (CSV)</button><div class="note" style="margin-top:6px">Il file contiene tutti i pagamenti del periodo scelto, con una colonna che distingue incassi reali, prove e omaggi.</div></div>';
    else h += '<div class="sec"><div class="note">Nessun pagamento da scaricare in questo periodo. Il file Excel (CSV) si può scaricare quando nel periodo scelto c\'è almeno un pagamento, anche di prova.</div></div>';
    $('inc_corpo').innerHTML = h;
  }
  async function cambiaCategoria(id, cat){
    var domanda = cat === 'reale' ? 'Riportare questo pagamento negli incassi reali?' : 'Spostare questo pagamento in prove e omaggi? Non conterà più nei totali.';
    if(!window.confirm(domanda)) return;
    try{

      INC = null;

  function scaricaCsv(){
    if(!INC || !INC.d) return;
    var righe = INC.d.righe || [];
    var cella = function(v){
      var s = (v === null || v === undefined) ? '' : String(v);
      return /[";\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    var out = [['Data','Cliente','Email','Pacchetto','Periodo','Tipo','Listino','Sconto','Codice sconto','Pagato','Commissioni Stripe','Arrivato a te','Categoria','Riferimento Stripe'].join(';')];
    righe.slice().reverse().forEach(function(p){
      var netto = (p.commissioni === null || p.commissioni === undefined) ? '' : numCsv(Number(p.importo) - Number(p.commissioni));
      out.push([
        dataLunga(p.pagato_il), p.cliente_nome || '', p.cliente_email || '', nomePiano(p.piano), p.periodo || '',
        tipoPagamento(p), p.tipo === 'rimborso' ? '' : numCsv(p.listino), numCsv(p.sconto || 0), p.codice_sconto || '',
        numCsv(p.importo), numCsv(p.commissioni), netto,
        p.categoria === 'reale' ? 'Incasso reale' : p.categoria === 'prova' ? 'Prova' : 'Omaggio', p.stripe_id || ''
      ].map(cella).join(';'));
    });
    var blob = new Blob(['\ufeff' + out.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'incassi-eventsfun_' + F.incDal + '_' + F.incAl + '.csv';
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 1500);
  }

      h += '<div class="bottoni" style="margin-top:12px"><a class="btn sec2 piccolo" href="mailto:' + esc(m.email) + '?subject=' + encodeURIComponent('EventsFun: risposta alla tua richiesta') + '">Rispondi per email</a>';
      h += '<button class="btn ' + (m.gestito_at ? 'sec2' : '') + ' piccolo" type="button" data-az="msg_gestito" data-id="' + esc(m.id) + '" data-val="' + (m.gestito_at ? '0' : '1') + '">' + (m.gestito_at ? 'Rimetti da gestire' : 'Segna come gestito') + '</button></div>';
      h += '</div>';
    });
    h += '</div></div>';
    metti(h);
  }
  async function segnaMessaggio(id, gestito){
    try{
      await chiedi('messaggio_sito_gestito', { messaggio_id: id, gestito: gestito });
      (DATI.messaggi_sito || []).forEach(function(m){ if(m.id === id) m.gestito_at = gestito ? new Date().toISOString() : null; });
      aggiornaBadge();
      toast(gestito ? 'Segnato come gestito' : 'Rimesso da gestire');
      disegnaRotta(false);
    }catch(e){
      if(!gestisciErrore(e)) toast(e.message, true);
    }
  }

  // ---------------- DA CONTROLLARE ----------------
  function vistaControllo(){
    var an = DATI.anomalie || {};
    var h = '<a class="back" href="#altro">' + ICO_BACK + 'Altro</a><div class="stretta">';
    h += '<div class="sec" style="padding-top:2px"><h1 class="h1">Da controllare</h1><div class="note" style="margin-top:4px">Le situazioni che non tornano nei dati. Non sono errori del sito: sono cose da guardare e decidere cosa farne.</div></div>';
    var blocco = function(titolo, spiega, lista, riga){
      var x = '<div class="sec"><div class="h2">' + titolo + ' <small>' + lista.length + '</small></div><div class="card">';
      if(!lista.length) x += '<div class="vuoto">Nessuno.</div>';
      else x += '<div class="row"><div class="grow note">' + spiega + '</div></div>';
      lista.forEach(function(o){ x += riga(o); });
      return x + '</div></div>';
    };
    h += blocco('Ordini senza email', 'Se era una persona vera, ha pagato e non ha ricevuto nulla. Cerca il riferimento nel pannello Stripe per risalire a chi era.', an.ordini_senza_email || [], function(o){
      return '<div class="row top-al"><div class="grow"><div class="t">Pagamento senza contatto</div><div class="s">Ricevuto ' + esc(art('il', dataLunga(o.created_at))) + ', ' + esc(euro(o.importo)) + '</div><div class="tok">' + esc(o.stripe_id || 'nessun riferimento') + '</div></div>' + pianoPill(o.piano) + '</div>';
    });
    h += blocco('Clienti senza accesso', 'Ordini senza un accesso aperto alla dashboard: il cliente non può entrare.', an.ordini_senza_accesso || [], function(o){
      return '<a class="row" href="#cliente/' + esc(o.id) + '"><div class="grow"><div class="t">' + esc(o.email || 'senza email') + '</div><div class="s">' + esc(art('Dal', dataLunga(o.created_at))) + '</div></div>' + pianoPill(o.piano) + ICO_CHEV + '</a>';
    });
    h += blocco('Abbonamenti annullati senza data di fine', 'Risultano annullati ma senza la data in cui finisce l\'accesso: il sistema li tratta ancora come validi.', an.annullati_senza_data || [], function(o){
      return '<a class="row" href="#cliente/' + esc(o.id) + '"><div class="grow"><div class="t">' + esc(o.email || 'senza email') + '</div><div class="s">' + esc(art('Dal', dataLunga(o.created_at))) + '</div></div>' + pianoPill(o.piano) + ICO_CHEV + '</a>';
    });
    h += blocco('Pagamenti senza dettagli da Stripe', 'Dopo 24 ore Stripe non ha ancora dato sconto e commissioni: controlla il pagamento nel pannello Stripe.', an.pagamenti_bloccati || [], function(p){
      return '<div class="row top-al"><div class="grow"><div class="t">' + esc(euro(p.importo)) + ', ' + esc(nomePiano(p.piano)) + '</div><div class="s">' + esc(dataLunga(p.pagato_il)) + '</div><div class="tok">' + esc(p.stripe_id || '') + '</div></div></div>';
    });
    h += blocco('Pagamenti senza cliente', 'Pagamenti registrati che non sono collegati a nessun cliente.', an.pagamenti_senza_cliente || [], function(p){
      return '<div class="row top-al"><div class="grow"><div class="t">' + esc(euro(p.importo)) + ', ' + esc(nomePiano(p.piano)) + '</div><div class="s">' + esc(dataLunga(p.pagato_il)) + '</div><div class="tok">' + esc(p.stripe_id || '') + '</div></div></div>';
    });
    h += blocco('Rimborsi non collegati', 'Rimborsi fatti su Stripe che non si è riusciti a collegare al pagamento originale.', an.rimborsi_scollegati || [], function(p){
      return '<div class="row top-al"><div class="grow"><div class="t">' + esc(euro(p.importo)) + '</div><div class="s">' + esc(dataLunga(p.pagato_il)) + '</div><div class="tok">' + esc(p.stripe_id || '') + '</div></div></div>';
    });
    h += blocco('Eventi senza cliente', 'Eventi il cui accesso non esiste più nell\'archivio. Quasi sempre sono residui di prove vecchie.', an.eventi_orfani || [], function(e){
      return '<div class="row top-al"><div class="grow"><div class="t">' + esc(e.nome || 'Evento senza nome') + '</div><div class="s">Data evento ' + esc(dataLunga(e.data_iso)) + ', creato ' + esc(art('il', dataLunga(e.created_at))) + ', ' + (e.n_iscritti === 1 ? '1 iscritto' : (e.n_iscritti || 0) + ' iscritti') + '</div></div><span class="pill p-warn">Senza cliente</span></div>';
    });
    h += '</div>';
    metti(h);
  }

  // ---------------- VENDITORI ----------------
  function vistaVenditori(){
    var h = '<a class="back" href="#altro">' + ICO_BACK + 'Altro</a><div class="stretta">';
    h += '<div class="sec" style="padding-top:2px"><h1 class="h1">Venditori</h1></div>';
    h += '<div class="sec"><div class="card">';
    if(!VENDITORI.length) h += '<div class="vuoto">Nessun venditore nel registro.</div>';
    VENDITORI.forEach(function(v){
      h += '<div class="row"' + (v.attivo ? '' : ' style="opacity:0.6"') + '><div class="grow"><div class="t">' + esc(v.nome) + '</div><div class="s">Codice sconto ' + esc(v.coupon) + ', ' + (v.email ? esc(v.email) : '<span style="color:var(--warn)">email mancante</span>') + (v.attivo ? '' : ', disattivato') + '</div></div>';
      if(ME.ruolo === 'admin') h += '<button class="btn sec2 piccolo" type="button" data-az="vend_stato" data-code="' + esc(v.code) + '" data-val="' + (v.attivo ? '0' : '1') + '">' + (v.attivo ? 'Disattiva' : 'Riattiva') + '</button>';
      h += '</div>';
    });
    h += '</div></div>';
    if(ME.ruolo === 'admin'){
      h += '<div class="sec"><div class="h2">Aggiungi venditore</div><div class="card pad">';
      h += '<div class="campo"><label class="lbl" for="vend_nome">Nome</label><input class="field" type="text" id="vend_nome" maxlength="80"></div>';
      h += '<div class="campo"><label class="lbl" for="vend_coupon">Codice sconto</label><input class="field" type="text" id="vend_coupon" maxlength="40" autocapitalize="characters"></div>';
      h += '<div class="campo"><label class="lbl" for="vend_email">Email (per la newsletter)</label><input class="field" type="email" id="vend_email" maxlength="120"></div>';
      h += '<div class="note" style="margin-bottom:10px">Il codice sconto serve ad attribuire le vendite; l\'email a mandargli le comunicazioni.</div>';
      h += '<button class="btn sec2" type="button" data-az="vend_aggiungi" id="vend_btn">Aggiungi</button><div class="msgx" id="vend_msg"></div></div></div>';
    }
    h += '</div>';
    metti(h);
  }
  async function ricaricaVenditori(){
    try{ var v = await chiedi('venditori_lista'); VENDITORI = v.venditori || []; }catch(e){ if(!gestisciErrore(e)) throw e; }
  }
  async function aggiungiVenditore(){
    var msg = $('vend_msg'), btn = $('vend_btn');
    nascondiMsg(msg);
    var nome = $('vend_nome').value.trim(), coupon = $('vend_coupon').value.trim(), email = $('vend_email').value.trim();
    if(!nome || !coupon){ mostraMsg(msg, 'Inserisci nome e codice sconto.', 'err'); return; }
    btn.disabled = true; btn.textContent = 'Aggiungo...';
    try{
      await chiedi('venditore_aggiungi', { nome: nome, coupon: coupon, email: email });
      await ricaricaVenditori();
      toast('Venditore aggiunto');
      vistaVenditori();
    }catch(e){
      btn.disabled = false; btn.textContent = 'Aggiungi';
      if(!gestisciErrore(e)) mostraMsg(msg, e.message, 'err');
    }
  }
  async function statoVenditore(code, attivo){
    try{
      await chiedi('venditore_stato', { code: code, attivo: attivo });
      await ricaricaVenditori();
      toast(attivo ? 'Venditore riattivato' : 'Venditore disattivato');
      vistaVenditori();
    }catch(e){
      if(!gestisciErrore(e)) toast(e.message, true);
    }
  }

  // ---------------- NEWSLETTER ----------------
  var NL_SEG = [
    { code: 'clienti_base', label: 'Clienti Base', breve: 'Base' },
    { code: 'clienti_pro', label: 'Clienti Pro', breve: 'Pro' },
    { code: 'clienti_agenzia', label: 'Clienti Agenzia', breve: 'Agenzia' },
    { code: 'clienti_info', label: 'Clienti Punto Info', breve: 'Punto Info' },
    { code: 'contatti_sito', label: 'Contatti dal sito (con consenso)', breve: 'Contatto dal sito' },
    { code: 'venditori', label: 'Venditori', breve: 'Venditore' }
  ];
  var nlSeq = 0, nlDest = [], nlEsclusi = {}, nlScelti = {};
  function nlBreve(code){ for(var i = 0; i < NL_SEG.length; i++){ if(NL_SEG[i].code === code) return NL_SEG[i].breve; } return code; }
  function vistaNewsletter(){
    var h = '<a class="back" href="#altro">' + ICO_BACK + 'Altro</a><div class="stretta">';
    h += '<div class="sec" style="padding-top:2px"><h1 class="h1">Newsletter</h1></div>';
    if(ME.ruolo !== 'admin'){ metti(h + '<div class="sec"><div class="msgx info">La newsletter è riservata all\'amministratore.</div></div></div>'); return; }
    h += '<div class="sec"><div class="h2">Destinatari</div><div class="card">';
    NL_SEG.forEach(function(s){
      h += '<label class="nl-check"><input type="checkbox" class="nl-seg" value="' + s.code + '"' + (nlScelti[s.code] ? ' checked' : '') + '><span class="grow">' + s.label + '</span><span class="nl-n" id="nln_' + s.code + '">..</span></label>';
    });
    h += '</div>';
    h += '<label class="chk" style="margin-top:8px"><input type="checkbox" id="nl_consenso">Ai clienti solo se hanno dato il consenso newsletter</label>';
    h += '<div class="note">Il consenso riguarda i clienti. I contatti dal sito sono solo quelli che hanno dato il consenso agli aggiornamenti; i venditori sono sempre inclusi.</div>';
    h += '<div class="card" style="margin-top:12px"><div class="row"><div class="grow"><b id="nl_tot">0</b> destinatari selezionati</div></div><div class="nl-lista" id="nl_lista"></div></div></div>';
    h += '<div class="sec"><div class="h2">Messaggio</div><div class="card pad">';
    h += '<div class="campo"><label class="lbl" for="nl_oggetto">Oggetto</label><input class="field" type="text" id="nl_oggetto" maxlength="200"></div>';
    h += '<div class="campo"><label class="lbl" for="nl_from">Nome del mittente</label><input class="field" type="text" id="nl_from" maxlength="60" value="EventsFun"></div>';
    h += '<div class="campo"><label class="lbl" for="nl_reply">Email per le risposte</label><input class="field" type="email" id="nl_reply" value="info@eventsfun.com"></div>';
    h += '<div class="campo"><label class="lbl" for="nl_corpo">Testo del messaggio</label><textarea class="field" id="nl_corpo" rows="8" maxlength="100000"></textarea></div>';
    h += '<div class="note" style="margin-bottom:12px">Testo semplice: gli a capo diventano righe e i link http diventano cliccabili. Le email partono con l\'intestazione EventsFun.</div>';
    h += '<button class="btn pieno" type="button" data-az="nl_invia" id="nl_btn">Invia newsletter</button><div class="msgx" id="nl_msg"></div></div></div>';
    h += '<div class="sec"><div class="h2">Invii precedenti</div><div class="card" id="nl_storico"><div class="vuoto">Caricamento...</div></div></div>';
    h += '</div>';
    metti(h);
    Array.prototype.forEach.call(document.querySelectorAll('.nl-seg'), function(c){
      c.addEventListener('change', function(){ nlScelti[this.value] = this.checked; aggiornaListaNl(); });
    });
    $('nl_consenso').addEventListener('change', aggiornaListaNl);
    aggiornaListaNl();
    caricaStoricoNl();
  }
  function segmentiNl(){
    var out = [];
    Array.prototype.forEach.call(document.querySelectorAll('.nl-seg'), function(c){ if(c.checked) out.push(c.value); });
    return out;
  }
  function totaleNl(){
    var n = 0;
    nlDest.forEach(function(d){ if(!nlEsclusi[d.email]) n++; });
    if($('nl_tot')) $('nl_tot').textContent = n;
    return n;
  }
  function disegnaDestNl(){
    var cont = $('nl_lista'); if(!cont) return;
    if(!nlDest.length){ cont.innerHTML = '<div class="vuoto">Scegli un gruppo per vedere chi riceverà la newsletter.</div>'; totaleNl(); return; }
    var h = '';
    nlDest.forEach(function(d){
      var badge = (d.segmenti || []).map(function(s){ return '<span class="nl-badge">' + esc(nlBreve(s)) + '</span>'; }).join('');
      h += '<label class="nl-dest"><input type="checkbox" class="nl-desti" data-email="' + esc(d.email) + '"' + (nlEsclusi[d.email] ? '' : ' checked') + '><span class="grow" style="min-width:0"><span class="t" style="display:block">' + esc(d.nome || d.email) + '</span><span class="s" style="display:block">' + esc(d.email) + '</span></span><span>' + badge + '</span></label>';
    });
    cont.innerHTML = h;
    Array.prototype.forEach.call(cont.querySelectorAll('.nl-desti'), function(c){
      c.addEventListener('change', function(){
        var em = this.getAttribute('data-email');
        if(this.checked) delete nlEsclusi[em]; else nlEsclusi[em] = true;
        totaleNl();
      });
    });
    totaleNl();
  }
  async function aggiornaListaNl(){
    var seg = segmentiNl();
    var cons = $('nl_consenso') ? $('nl_consenso').checked : false;
    var mio = ++nlSeq;
    try{
      var res = await chiedi('newsletter_lista', { segmenti: seg, solo_consenso: cons });
      if(mio !== nlSeq) return;
      var per = res.per_segmento || {};
      NL_SEG.forEach(function(s){ var el = $('nln_' + s.code); if(el) el.textContent = per[s.code] != null ? per[s.code] : 0; });
      nlDest = res.destinatari || [];
      var presenti = {};
      nlDest.forEach(function(d){ presenti[d.email] = true; });
      Object.keys(nlEsclusi).forEach(function(em){ if(!presenti[em]) delete nlEsclusi[em]; });
      disegnaDestNl();
    }catch(e){
      if(mio !== nlSeq) return;
      if(!gestisciErrore(e)){ nlDest = []; disegnaDestNl(); toast('Destinatari non disponibili: ' + e.message, true); }
    }
  }
  function testoInHtml(t){
    var e = esc(t).replace(/(https?:\/\/[^\s<]+)/g, function(u){ return '<a href="' + u + '">' + u + '</a>'; });
    return e.replace(/\r\n|\r|\n/g, '<br>');
  }
  async function caricaStoricoNl(){
    var cont = $('nl_storico'); if(!cont) return;
    try{
      var res = await chiedi('newsletter_storico', {});
      var st = res.storico || [];
      if(!$('nl_storico')) return;
      if(!st.length){ cont.innerHTML = '<div class="vuoto">Nessun invio registrato.</div>'; return; }
      var h = '';
      st.forEach(function(s){
        var segs = (s.segmenti || []).map(nlBreve).join(', ');
        var meta = (segs || 'nessun gruppo') + ', ' + (s.inviate || 0) + ' inviate su ' + (s.totale || 0) + (s.fallite ? ', ' + s.fallite + ' non riuscite' : '') + (s.esclusi ? ', ' + s.esclusi + ' esclusi' : '');
        h += '<details class="pag"><summary class="row top-al"><div class="grow"><div class="t wrap">' + esc(s.oggetto || '(senza oggetto)') + '</div><div class="s">' + esc(quando(s.created_at)) + '</div><div class="s">' + esc(meta) + '</div></div></summary>';
        h += '<div class="pag-det"><div class="btesto">' + esc(s.corpo || '(testo non salvato)') + '</div></div></details>';
      });
      cont.innerHTML = h;
    }catch(e){
      if(!gestisciErrore(e) && $('nl_storico')) cont.innerHTML = '<div class="vuoto">Impossibile caricare gli invii precedenti.</div>';
    }
  }
  async function inviaNewsletter(){
    var msg = $('nl_msg'), btn = $('nl_btn');
    nascondiMsg(msg);
    var seg = segmentiNl();
    var cons = $('nl_consenso').checked;
    var oggetto = $('nl_oggetto').value.trim(), from = $('nl_from').value.trim(), reply = $('nl_reply').value.trim(), corpo = $('nl_corpo').value.trim();
    if(!seg.length){ mostraMsg(msg, 'Scegli almeno un gruppo di destinatari.', 'err'); return; }
    if(!oggetto){ mostraMsg(msg, 'Scrivi l\'oggetto.', 'err'); return; }
    if(!corpo){ mostraMsg(msg, 'Scrivi il testo del messaggio.', 'err'); return; }
    var n = totaleNl();
    if(!n){ mostraMsg(msg, 'Nessun destinatario selezionato.', 'err'); return; }
    if(!window.confirm('Stai per inviare a ' + n + (n === 1 ? ' destinatario' : ' destinatari') + '. Procedere?')) return;
    btn.disabled = true; btn.textContent = 'Invio in corso...';
    try{
      var res = await chiedi('newsletter_invia', { segmenti: seg, solo_consenso: cons, oggetto: oggetto, from_name: from, reply_to: reply, html: testoInHtml(corpo), corpo: corpo, esclusi: Object.keys(nlEsclusi) });
      btn.disabled = false; btn.textContent = 'Invia newsletter';
      var inv = res.inviate || 0, fal = res.fallite || 0;
      mostraMsg(msg, inv + (inv === 1 ? ' email inviata' : ' email inviate') + (fal ? ', ' + fal + ' non riuscite.' : '.'), fal ? 'err' : 'ok');
      if(!fal){ $('nl_oggetto').value = ''; $('nl_corpo').value = ''; }
      caricaStoricoNl();
    }catch(e){
      btn.disabled = false; btn.textContent = 'Invia newsletter';
      if(!gestisciErrore(e)) mostraMsg(msg, 'Invio non riuscito: ' + e.message, 'err');
    }
  }

  // ---------------- comandi ----------------
  document.addEventListener('click', function(ev){
    var el = ev.target.closest('[data-az],[data-fcli],[data-per],[data-piano],[data-ass],[data-fev],[data-fmsg]');
    if(!el || !$('vista').contains(el)) return;
    if(el.hasAttribute('data-fcli')){ F.cli = el.getAttribute('data-fcli'); listaClienti(rotta().id); return; }
    if(el.hasAttribute('data-per')){ F.incPer = el.getAttribute('data-per'); INC = null; vistaIncassi(); return; }
    if(el.hasAttribute('data-piano')){ F.incPiano = el.getAttribute('data-piano'); INC = null; vistaIncassi(); return; }
    if(el.hasAttribute('data-ass')){ F.ass = el.getAttribute('data-ass'); vistaAssistenza(); return; }
    if(el.hasAttribute('data-fev')){ F.ev = el.getAttribute('data-fev'); listaEventi(); return; }
    if(el.hasAttribute('data-fmsg')){ F.msg = el.getAttribute('data-fmsg'); vistaMessaggi(); return; }
    var az = el.getAttribute('data-az');
    switch(az){
      case 'riprova': avvia(); break;
      case 'esci': esci(); break;
      case 'scrivi': $('scrivi_box').hidden = false; $('nv_txt').focus(); break;
      case 'scrivi_annulla': $('scrivi_box').hidden = true; break;
      case 'scrivi_invia': inviaNuovaConversazione(); break;
      case 'attr_salva': salvaAttribuzione(); break;
      case 'nota_salva': salvaNota(); break;
      case 'nota_elimina': eliminaNota(el.getAttribute('data-id')); break;
      case 'cat': ev.preventDefault(); cambiaCategoria(el.getAttribute('data-id'), el.getAttribute('data-cat')); break;
      case 'csv': scaricaCsv(); break;
      case 'rispondi': inviaRisposta(); break;
      case 'stato': cambiaStatoRichiesta(el.getAttribute('data-stato')); break;
      case 'nota_int': salvaNotaInterna(); break;
      case 'allegato': apriAllegato(el.getAttribute('data-mid'), el.getAttribute('data-aid')); break;
      case 'msg_gestito': segnaMessaggio(el.getAttribute('data-id'), el.getAttribute('data-val') === '1'); break;
      case 'vend_aggiungi': aggiungiVenditore(); break;
      case 'vend_stato': statoVenditore(el.getAttribute('data-code'), el.getAttribute('data-val') === '1'); break;
      case 'nl_invia': inviaNewsletter(); break;
    }
  });

  document.addEventListener('DOMContentLoaded', function(){
    $('lg_btn').addEventListener('click', accedi);
    $('lg_pw').addEventListener('keydown', function(e){ if(e.key === 'Enter') accedi(); });
    $('lg_email').addEventListener('keydown', function(e){ if(e.key === 'Enter') $('lg_pw').focus(); });
    $('btnEsci').addEventListener('click', esci);
    $('btnAggiorna').addEventListener('click', aggiornaTutto);
    window.addEventListener('hashchange', function(){ disegnaRotta(true); });
    sb.auth.getSession().then(function(s){
      if(s && s.data && s.data.session) avvia(); else mostraLogin();
    }).catch(function(){ mostraLogin(); });
  });
})();
</script>
